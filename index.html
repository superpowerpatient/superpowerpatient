<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="이겨내자 오늘도" />
  <meta name="theme-color" content="#E91E8C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />

  <title>이겨내자 오늘도 🎗️</title>

  <!-- CDN 로딩 순서: React → ReactDOM → prop-types → Recharts → Babel → Tailwind -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // Tailwind 커스텀 테마
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E91E8C',
            secondary: '#6C63FF',
            softbg: '#FFF8FC',
            textmain: '#2D1B3D',
            textsub: '#6B7280',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo',
                   'Noto Sans KR', 'Pretendard', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            card: '0 4px 20px rgba(233, 30, 140, 0.08)',
          },
        },
      },
    };
  </script>

  <style>
    /* iOS Safari: 탭 파란 하이라이트 제거 */
    * { -webkit-tap-highlight-color: transparent; }

    /* 바운스 스크롤/가로 스크롤 차단 */
    html, body {
      overscroll-behavior-y: contain;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background-color: #FFF8FC;
      color: #2D1B3D;
    }

    /* iOS 자동 확대 방지: input/textarea/select는 최소 16px */
    input, textarea, select { font-size: 16px !important; }

    /* 터치 지연(300ms) 제거 */
    button, a, [role="button"] { touch-action: manipulation; }

    /* 노치/홈 인디케이터 대응 */
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    /* 하단 탭바: 홈 인디케이터 위에 뜨도록 */
    .tab-bar {
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
    }

    /* 내부 스크롤 영역 iOS 관성 */
    .scroll-area {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* 버튼/탭 텍스트 선택 방지 */
    .no-select {
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus, input:focus, textarea:focus, select:focus { outline: none; }

    /* 선택된 기분 버튼 살짝 확대 */
    .mood-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .mood-btn.selected { transform: scale(1.1); }

    /* 형광펜 느낌 화이팅 카드 */
    .highlighter {
      background: linear-gradient(180deg, transparent 55%, #FFF59D 55%);
    }
  </style>
</head>

<body class="bg-softbg font-sans">
  <div id="root">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#E91E8C;font-family:-apple-system,sans-serif;">
      이겨내자 오늘도 🎗️ 로딩 중…
    </div>
  </div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    const {
      LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer
    } = Recharts;

    // ========== localStorage 키 ==========
    const STORAGE_KEYS = {
      cheering:    'igt_cheering',
      mood:        'igt_mood',
      treatment:   'igt_treatment',
      sideEffects: 'igt_sideeffects',
      medications: 'igt_medications',
      vitals:      'igt_vitals',
      meals:       'igt_meals',
      diary:       'igt_diary',
      expenses:    'igt_expenses',
      insurance:   'igt_insurance',
      profile:     'igt_profile',
    };

    // ========== 공통 유틸 ==========
    function loadData(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        console.warn('loadData 실패:', key, e);
        return fallback;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn('saveData 실패:', key, e);
      }
    }

    function generateId() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    // 로컬 타임존 기준 YYYY-MM-DD
    function todayKey(d) {
      const dt = d ? new Date(d) : new Date();
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    function formatKoreanDate(dateStr) {
      const dt = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      return `${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 (${WEEKDAYS[dt.getDay()]})`;
    }

    // ========== 기분 이모지 ==========
    const MOODS = [
      { value: 'great', emoji: '😄', label: '아주 좋음' },
      { value: 'good',  emoji: '😊', label: '좋음' },
      { value: 'soso',  emoji: '😐', label: '그저 그럼' },
      { value: 'down',  emoji: '😔', label: '힘듦' },
      { value: 'bad',   emoji: '😢', label: '매우 힘듦' },
    ];

    // ========== 탭 정의 ==========
    const TABS = [
      { key: 'home',      icon: '📋', label: '오늘' },
      { key: 'treatment', icon: '💊', label: '치료' },
      { key: 'body',      icon: '🏥', label: '몸상태' },
      { key: 'diary',     icon: '📖', label: '일기' },
      { key: 'expense',   icon: '💰', label: '병원비' },
    ];

    // ========== 항암 레지멘 프리셋 ==========
    // 단순 기록용 참고 데이터입니다. 실제 처방은 반드시 담당의 지시를 따라야 합니다.
    // - cycleDays: 한 사이클 길이(일)
    // - infusionDays: 사이클 내 주입/투여 일수 (0이면 경구 단독)
    // - type: 'infusion' | 'oral' | 'mixed' | 'custom'
    const REGIMEN_DISCLAIMER =
      '※ 본 레지멘 정보는 일반적인 참고 자료이며, 실제 처방·용량·일정은 담당 의료진의 지시를 따라야 합니다.';

    const REGIMEN_PRESETS = {
      // === 대장암 ===
      colorectal: {
        label: '대장암',
        regimens: [
          { name: 'FOLFOX', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '입원 또는 외래 후 46시간 지속주입 (보통 1박2일~2박3일)' },
          { name: 'FOLFIRI', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'FOLFOXIRI', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'XELOX (CAPOX)', cycleDays: 21, infusionDays: 1, type: 'mixed',
            desc: '옥살리플라틴 1일 + 카페시타빈 경구 14일' },
          { name: 'CAPIRI', cycleDays: 21, infusionDays: 1, type: 'mixed',
            desc: '이리노테칸 1일 + 카페시타빈 경구 14일' },
          { name: '카페시타빈 단독', cycleDays: 21, infusionDays: 0, type: 'oral',
            desc: '경구 14일 복용 후 7일 휴약' },
        ],
      },
      // === 유방암 ===
      breast: {
        label: '유방암',
        regimens: [
          { name: 'AC', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '아드리아마이신 + 사이클로포스파마이드' },
          { name: 'AC-T', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: 'AC 4회 후 탁솔/탁소텔' },
          { name: 'TC', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '도세탁셀 + 사이클로포스파마이드' },
          { name: 'TCH (TCHP)', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '도세탁셀 + 카보플라틴 + 허셉틴 (+퍼제타)' },
          { name: 'Paclitaxel weekly', cycleDays: 7, infusionDays: 1, type: 'infusion',
            desc: '주 1회 투여' },
          { name: 'Trastuzumab', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '허셉틴 단독 유지' },
        ],
      },
      // === 폐암 ===
      lung: {
        label: '폐암',
        regimens: [
          { name: 'Pemetrexed + Cisplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Pemetrexed + Carboplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Paclitaxel + Carboplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Gemcitabine + Cisplatin', cycleDays: 21, infusionDays: 2, type: 'infusion',
            desc: '1일과 8일 투여' },
          { name: 'Etoposide + Cisplatin (EP)', cycleDays: 21, infusionDays: 3, type: 'infusion',
            desc: '소세포폐암, 1~3일 연속 투여 (보통 2박3일 입원)' },
          { name: 'Pembrolizumab', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '키트루다, 21일 또는 42일 주기' },
        ],
      },
      // === 위암 ===
      gastric: {
        label: '위암',
        regimens: [
          { name: 'XP (Capecitabine + Cisplatin)', cycleDays: 21, infusionDays: 1, type: 'mixed' },
          { name: 'FP (5-FU + Cisplatin)', cycleDays: 28, infusionDays: 5, type: 'infusion',
            desc: '5일 연속 입원 투여' },
          { name: 'DCF', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '도세탁셀+시스플라틴+5FU, 5일 입원' },
          { name: 'FOLFOX', cycleDays: 14, infusionDays: 2, type: 'infusion' },
          { name: 'Ramucirumab + Paclitaxel', cycleDays: 28, infusionDays: 1, type: 'infusion',
            desc: '1, 8, 15일 파클리탁셀 + 1, 15일 라무시루맙' },
        ],
      },
      // === 췌장암 / 담도암 ===
      pancreatic: {
        label: '췌장암/담도암',
        regimens: [
          { name: 'FOLFIRINOX', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'Gemcitabine + Nab-paclitaxel', cycleDays: 28, infusionDays: 3, type: 'infusion',
            desc: '1, 8, 15일 투여 후 1주 휴약' },
          { name: 'Gemcitabine + Cisplatin', cycleDays: 21, infusionDays: 2, type: 'infusion',
            desc: '담도암 표준' },
          { name: 'Gemcitabine 단독', cycleDays: 28, infusionDays: 3, type: 'infusion',
            desc: '1, 8, 15일 투여' },
        ],
      },
      // === 혈액암 ===
      hematologic: {
        label: '혈액암 (림프종/백혈병)',
        regimens: [
          { name: 'R-CHOP', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: 'B세포 림프종 표준' },
          { name: 'R-CVP', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'ABVD', cycleDays: 28, infusionDays: 2, type: 'infusion',
            desc: '호지킨 림프종, 1일과 15일 투여' },
          { name: 'BEACOPP', cycleDays: 21, infusionDays: 7, type: 'infusion',
            desc: '입원 7일 강력 요법' },
          { name: 'DA-EPOCH-R', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '5일 지속주입 (보통 4박5일 입원)' },
          { name: 'Bendamustine + Rituximab', cycleDays: 28, infusionDays: 2, type: 'infusion' },
        ],
      },
      // === 부인암 ===
      gyne: {
        label: '난소암/자궁암',
        regimens: [
          { name: 'Paclitaxel + Carboplatin (TC)', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Carboplatin 단독', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Doxorubicin (PLD)', cycleDays: 28, infusionDays: 1, type: 'infusion' },
          { name: 'Topotecan', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '5일 연속 투여' },
          { name: 'Olaparib', cycleDays: 28, infusionDays: 0, type: 'oral',
            desc: '경구 매일 복용' },
        ],
      },
      // === 면역항암제 ===
      immune: {
        label: '면역항암제',
        regimens: [
          { name: 'Pembrolizumab (키트루다)', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '21일 또는 42일 주기' },
          { name: 'Nivolumab (옵디보)', cycleDays: 14, infusionDays: 1, type: 'infusion',
            desc: '14일 또는 28일 주기' },
          { name: 'Atezolizumab (티쎈트릭)', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Durvalumab (임핀지)', cycleDays: 14, infusionDays: 1, type: 'infusion' },
          { name: 'Ipilimumab + Nivolumab', cycleDays: 21, infusionDays: 1, type: 'infusion' },
        ],
      },
      // === 직접 입력 ===
      custom: {
        label: '직접 입력',
        regimens: [
          { name: '직접 입력', cycleDays: 14, infusionDays: 1, type: 'custom',
            desc: '본인 처방전 기준으로 입력하세요' },
        ],
      },
    };

    // ========== 공통 UI ==========
    function Header({ title }) {
      const today = formatKoreanDate();
      return (
        <header className="safe-top sticky top-0 z-20 bg-softbg/95 backdrop-blur">
          <div className="px-5 pt-3 pb-3 flex items-end justify-between">
            <div>
              <div className="text-lg font-bold text-primary leading-tight">
                이겨내자 오늘도 🎗️
              </div>
              <div className="text-xs text-textsub mt-0.5">{today}</div>
            </div>
            <div className="text-sm font-semibold text-textmain">{title}</div>
          </div>
          <div className="h-px bg-primary/10" />
        </header>
      );
    }

    function TabBar({ current, onChange }) {
      return (
        <nav className="tab-bar fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px]
                        bg-white/95 backdrop-blur border-t border-primary/10 z-30 no-select">
          <ul className="flex">
            {TABS.map(t => {
              const active = current === t.key;
              return (
                <li key={t.key} className="flex-1">
                  <button
                    onClick={() => onChange(t.key)}
                    className={`w-full flex flex-col items-center justify-center py-2
                                ${active ? 'text-primary' : 'text-textsub'}`}
                    style={{ minHeight: '56px' }}
                    aria-label={t.label}
                  >
                    <span className="text-2xl leading-none">{t.icon}</span>
                    <span className={`text-[11px] mt-1 ${active ? 'font-bold' : ''}`}>
                      {t.label}
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
        </nav>
      );
    }

    function Card({ title, children, className = '' }) {
      return (
        <section className={`bg-white rounded-2xl shadow-card p-4 ${className}`}>
          {title && (
            <h2 className="text-base font-bold text-textmain mb-3">{title}</h2>
          )}
          {children}
        </section>
      );
    }

    function PrimaryButton({ children, onClick, disabled, type = 'button', className = '' }) {
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`rounded-full bg-primary text-white font-semibold px-5 py-3 no-select
                      active:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed
                      ${className}`}
          style={{ minHeight: '44px' }}
        >
          {children}
        </button>
      );
    }

    function GhostButton({ children, onClick, className = '' }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`rounded-full border border-primary/30 text-primary font-medium px-4 py-2
                      no-select active:bg-primary/5 ${className}`}
          style={{ minHeight: '40px' }}
        >
          {children}
        </button>
      );
    }

    function ConfirmDialog({ open, title, message, onConfirm, onCancel }) {
      if (!open) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6"
          style={{ touchAction: 'none' }}
          onClick={onCancel}
        >
          <div
            className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-card"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="font-bold text-textmain text-base">{title}</div>
            <div className="text-sm text-textsub mt-2 leading-relaxed">{message}</div>
            <div className="flex gap-2 mt-5 justify-end">
              <GhostButton onClick={onCancel}>취소</GhostButton>
              <PrimaryButton onClick={onConfirm}>확인</PrimaryButton>
            </div>
          </div>
        </div>
      );
    }

    // ========== 탭 1: 홈 ==========
    function HomeTab({ onNavigate }) {
      const today = todayKey();

      // 화이팅 메시지
      const [cheeringList, setCheeringList] = useState(() =>
        loadData(STORAGE_KEYS.cheering, [])
      );
      const [cheeringDraft, setCheeringDraft] = useState('');
      const [overwriteOpen, setOverwriteOpen] = useState(false);

      useEffect(() => {
        saveData(STORAGE_KEYS.cheering, cheeringList);
      }, [cheeringList]);

      const todaysCheering = useMemo(
        () => cheeringList.find(c => c.date === today) || null,
        [cheeringList, today]
      );

      // 기분
      const [moodList, setMoodList] = useState(() =>
        loadData(STORAGE_KEYS.mood, [])
      );
      useEffect(() => {
        saveData(STORAGE_KEYS.mood, moodList);
      }, [moodList]);
      const todaysMood = useMemo(
        () => moodList.find(m => m.date === today) || null,
        [moodList, today]
      );

      // 요약용 데이터
      const vitals = loadData(STORAGE_KEYS.vitals, []);
      const meals = loadData(STORAGE_KEYS.meals, []);
      const sideEffects = loadData(STORAGE_KEYS.sideEffects, []);
      const medications = loadData(STORAGE_KEYS.medications, []);

      const todaysVital = vitals.find(v => v.date === today) || null;
      const todaysMeal  = meals.find(m => m.date === today) || null;
      const todaysSideEffect = sideEffects.find(s => s.date === today) || null;
      const todaysMedCount = medications.filter(m => m.date === today).length;

      const mealRatio = todaysMeal ? (() => {
        const parts = ['breakfast', 'lunch', 'snack', 'dinner']
          .map(k => (todaysMeal[k] ? Number(todaysMeal[k].ratio) || 0 : null))
          .filter(v => v !== null);
        if (parts.length === 0) return null;
        return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length);
      })() : null;

      const sideEffectCount = todaysSideEffect
        ? Object.values(todaysSideEffect.items || {}).filter(v => Number(v) > 0).length
        : null;

      // 저장 핸들러
      function handleSaveCheering() {
        const text = cheeringDraft.trim();
        if (!text) return;
        if (todaysCheering) {
          setOverwriteOpen(true);
          return;
        }
        commitCheering(text);
      }

      function commitCheering(text) {
        const mood = todaysMood ? todaysMood.emoji : null;
        const newItem = { id: generateId(), date: today, mood, text };
        setCheeringList(prev => {
          const without = prev.filter(c => c.date !== today);
          return [newItem, ...without];
        });
        setCheeringDraft('');
        setOverwriteOpen(false);
      }

      function handleOverwriteConfirm() {
        commitCheering(cheeringDraft.trim());
      }

      function handleSelectMood(m) {
        const emoji = m.emoji;
        setMoodList(prev => {
          const without = prev.filter(x => x.date !== today);
          return [{ date: today, emoji, value: m.value }, ...without];
        });
      }

      return (
        <div className="px-4 pb-6 space-y-4">

            {todaysCheering ? (
              <div className="space-y-3">
                <div className="rounded-xl border border-primary/30 bg-yellow-50 p-4">
                  <div className="text-xs text-textsub mb-1">
                    {formatKoreanDate(todaysCheering.date)}
                    {todaysCheering.mood ? ` · ${todaysCheering.mood}` : ''}
                  </div>
                  <div className="text-[15px] leading-relaxed text-textmain"
                       style={{ userSelect: 'text', WebkitUserSelect: 'text' }}>
                    <span className="highlighter">{todaysCheering.text}</span>
                  </div>
                </div>
                <div className="flex gap-2">
                  <GhostButton
                    onClick={() => {
                      setCheeringDraft(todaysCheering.text);
                      setCheeringList(prev => prev.filter(c => c.date !== today));

                  >
                    수정하기

                  <GhostButton onClick={() => onNavigate('diary')}>

                  </GhostButton>
                </div>

            ) : (
              <div className="space-y-3">
                <textarea
                  value={cheeringDraft}
                  onChange={(e) => setCheeringDraft(e.target.value)}
                  placeholder="오늘의 나에게 한마디를 남겨요 💪"
                  rows={3}
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3
                             text-textmain placeholder:text-textsub/70 resize-none"
                />
                <div className="flex justify-end">
                  <PrimaryButton
                    onClick={handleSaveCheering}
                    disabled={!cheeringDraft.trim()}

                    저장
                  </PrimaryButton>
                </div>
              </div>
            )}
          </Card>

          {/* 오늘의 기분 */}
          <Card title="💖 오늘의 기분">
            <div className="flex justify-between">
              {MOODS.map(m => {
                const active = todaysMood && todaysMood.value === m.value;
                return (
                  <button
                    key={m.value}
                    onClick={() => handleSelectMood(m)}
                    aria-label={m.label}
                    className={`mood-btn no-select flex flex-col items-center justify-center
                                rounded-2xl ${active ? 'selected bg-primary/10 ring-2 ring-primary' : 'bg-softbg'}`}

                    <span className="text-3xl leading-none">{m.emoji}</span>
                  </button>

            </div>
            <div className="text-center text-xs text-textsub mt-3">
              {todaysMood
                ? `지금 기분: ${MOODS.find(x => x.value === todaysMood.value)?.label || ''}`
                : '기분을 골라주세요'}

          </Card>

          {/* 오늘 요약 */}
          <Card title="📊 오늘의 요약">
            <ul className="divide-y divide-primary/10">
              <SummaryRow
                label="체중"
                value={todaysVital ? `${todaysVital.weight} kg${todaysVital.bsa ? ` · BSA ${todaysVital.bsa}` : ''}` : null}
                onGo={() => onNavigate('body')}
              />
              <SummaryRow
                label="식사량"

              <SummaryRow
                label="부작용"

              />
              <SummaryRow
                label="복용약"

    function SummaryRow({ label, value, onGo }) {
      const empty = value === null || value === undefined || value === '';
      return (
        <li className="py-3 flex items-center justify-between gap-2">
          <div className="text-sm font-medium text-textmain w-20 shrink-0">{label}</div>
          <div className={`flex-1 text-sm ${empty ? 'text-textsub' : 'text-textmain'}`}>
            {empty ? '아직 입력 전' : value}

          {empty && (
            <button
              onClick={onGo}
              className="text-xs font-semibold text-primary no-select px-2 py-1 rounded-full
                         border border-primary/30 active:bg-primary/5"
            >
              이동
            </button>
          )}
        </li>
      );
    }

    // ========== 공통: 상세 보기 모달 ==========
    function DetailModal({ open, onClose, children }) {
      if (!open) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40"
          style={{ touchAction: 'none' }}
          onClick={onClose}

          <div
            className="bg-white w-full max-w-[480px] rounded-t-2xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto scroll-area"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom))' }}
            onClick={(e) => e.stopPropagation()}

            <div className="flex justify-end mb-2">
              <button
                onClick={onClose}
                aria-label="닫기"
                className="text-textsub no-select text-xl px-2"
                style={{ minHeight: 36, minWidth: 36 }}

              </button>
            </div>

          </div>
        </div>
      );
    }

    // ========== 탭 4: 마음 일기 ==========
    const GALLERY_GRADIENTS = [
      'from-pink-200 to-rose-100',
      'from-purple-200 to-indigo-100',
      'from-yellow-200 to-orange-100',
      'from-green-200 to-teal-100',
      'from-blue-200 to-cyan-100',
      'from-red-200 to-pink-100',
      'from-indigo-200 to-purple-100',
      'from-teal-200 to-green-100',
      'from-orange-200 to-yellow-100',
      'from-cyan-200 to-blue-100',
    ];

    function DiaryTab() {
      const [diaryList, setDiaryList] = useState(() => loadData(STORAGE_KEYS.diary, []));
      const [cheeringList] = useState(() => loadData(STORAGE_KEYS.cheering, []));

      const [draftDate, setDraftDate] = useState(todayKey());
      const [draftMood, setDraftMood] = useState(null);
      const [draftBody, setDraftBody] = useState('');
      const [draftGrateful, setDraftGrateful] = useState(['', '', '']);
      const [draftHard, setDraftHard] = useState('');

      const [viewDiary, setViewDiary] = useState(null);
      const [viewCheering, setViewCheering] = useState(null);
      const [deleteId, setDeleteId] = useState(null);

      // 일기 자동 저장
      useEffect(() => {
        saveData(STORAGE_KEYS.diary, diaryList);
      }, [diaryList]);

      // 선택 날짜의 기분을 igt_mood에서 pre-fill (홈 탭과 연동)
      useEffect(() => {
        const moods = loadData(STORAGE_KEYS.mood, []);
        const m = moods.find(x => x.date === draftDate);
        setDraftMood(m ? m.value : null);
      }, [draftDate]);

      function handleSelectMood(value) {
        setDraftMood(value);
        // 같은 날짜의 mood를 igt_mood에 write-back (홈과 연동)
        const mObj = MOODS.find(x => x.value === value);
        if (!mObj) return;
        const moods = loadData(STORAGE_KEYS.mood, []);
        const without = moods.filter(x => x.date !== draftDate);
        saveData(STORAGE_KEYS.mood, [
          { date: draftDate, emoji: mObj.emoji, value: mObj.value },
          ...without,
        ]);
      }

      function handleSave() {
        const body = draftBody.trim();
        if (!body) return;
        const moodObj = MOODS.find(m => m.value === draftMood);
        const entry = {
          id: generateId(),
          date: draftDate,
          mood: moodObj ? moodObj.emoji : null,
          body,
          grateful: draftGrateful.map(g => g.trim()).filter(Boolean),
          hard: draftHard.trim(),
        };
        setDiaryList(prev => [entry, ...prev]);
        setDraftBody('');
        setDraftGrateful(['', '', '']);
        setDraftHard('');
      }

      function handleDelete() {
        setDiaryList(prev => prev.filter(d => d.id !== deleteId));
        setDeleteId(null);
      }

      const sortedDiaries = useMemo(
        () => [...diaryList].sort((a, b) => (b.date || '').localeCompare(a.date || '')),
        [diaryList]
      );
      const sortedCheerings = useMemo(
        () => [...cheeringList].sort((a, b) => (b.date || '').localeCompare(a.date || '')),
        [cheeringList]
      );

      return (
        <div className="px-4 pb-6 space-y-4">
          {/* 4-1. 일기 작성 */}
          <Card title="📖 마음 일기 쓰기">
            <label className="block text-xs text-textsub mb-1">날짜</label>
            <input
              type="date"
              value={draftDate}
              onChange={(e) => setDraftDate(e.target.value)}
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 text-textmain"
            />

            <label className="block text-xs text-textsub mb-2">오늘의 기분</label>
            <div className="flex justify-between mb-4">
              {MOODS.map((m) => {
                const active = draftMood === m.value;
                return (
                  <button
                    key={m.value}
                    onClick={() => handleSelectMood(m.value)}
                    aria-label={m.label}
                    className={`mood-btn no-select flex items-center justify-center rounded-2xl
                                ${active ? 'selected bg-primary/10 ring-2 ring-primary' : 'bg-softbg'}`}
                    style={{ width: 54, height: 54 }}
                  >
                    <span className="text-2xl leading-none">{m.emoji}</span>
                  </button>
                );
              })}
            </div>

            <label className="block text-xs text-textsub mb-1">오늘의 이야기</label>
            <textarea
              value={draftBody}
              onChange={(e) => setDraftBody(e.target.value)}
              rows={8}
              placeholder="오늘 있었던 일, 느낀 점을 자유롭게 적어봐요."
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 resize-none text-textmain placeholder:text-textsub/70"
            />

            <label className="block text-xs text-textsub mb-1">감사한 일 3가지 (선택)</label>
            <div className="space-y-2 mb-4">
              {[0, 1, 2].map((i) => (
                <input
                  key={i}
                  type="text"
                  value={draftGrateful[i]}
                  onChange={(e) => {
                    const next = [...draftGrateful];
                    next[i] = e.target.value;
                    setDraftGrateful(next);
                  }}
                  placeholder={`감사 ${i + 1}`}
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70"
                />
              ))}
            </div>

            <label className="block text-xs text-textsub mb-1">힘들었던 점 (선택)</label>
            <textarea
              value={draftHard}
              onChange={(e) => setDraftHard(e.target.value)}
              rows={3}
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 resize-none text-textmain"
            />

            <div className="flex justify-end">
              <PrimaryButton onClick={handleSave} disabled={!draftBody.trim()}>
                일기 저장
              </PrimaryButton>
            </div>
          </Card>

          {/* 4-2. 화이팅 갤러리 */}
          <Card title="💪 화이팅 갤러리">
            {sortedCheerings.length === 0 ? (
              <div className="py-6 text-center text-sm text-textsub">
                홈 탭에서 저장한 화이팅 메시지가 여기에 모여요.
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-3">
                {sortedCheerings.map((c, i) => (
                  <button
                    key={c.id || c.date}
                    onClick={() => setViewCheering(c)}
                    className={`no-select text-left p-3 rounded-2xl shadow-sm bg-gradient-to-br ${GALLERY_GRADIENTS[i % 10]} active:opacity-80`}
                    style={{ minHeight: 110 }}
                  >
                    <div className="text-[11px] text-textsub mb-1">
                      {c.date}{c.mood ? ` · ${c.mood}` : ''}
                    </div>
                    <div className="text-sm font-medium text-textmain leading-snug"
                         style={{
                           display: '-webkit-box',
                           WebkitLineClamp: 4,
                           WebkitBoxOrient: 'vertical',
                           overflow: 'hidden',
                         }}>
                      {c.text}
                    </div>
                  </button>
                ))}
              </div>
            )}
          </Card>

          {/* 4-3. 일기 목록 */}
          <Card title="📔 일기 목록">
            {sortedDiaries.length === 0 ? (
              <div className="py-6 text-center text-sm text-textsub">
                아직 저장된 일기가 없어요.
              </div>
            ) : (
              <ul className="divide-y divide-primary/10">
                {sortedDiaries.map((d) => (
                  <li key={d.id} className="py-3 flex items-start gap-2">
                    <button
                      onClick={() => setViewDiary(d)}
                      className="flex-1 text-left no-select py-1"
                    >
                      <div className="text-xs text-textsub mb-0.5">
                        {d.date}{d.mood ? ` · ${d.mood}` : ''}
                      </div>
                      <div className="text-sm text-textmain leading-snug"
                           style={{
                             display: '-webkit-box',
                             WebkitLineClamp: 2,
                             WebkitBoxOrient: 'vertical',
                             overflow: 'hidden',
                           }}>
                        {d.body}
                      </div>
                    </button>
                    <button
                      onClick={() => setDeleteId(d.id)}
                      aria-label="삭제"
                      className="text-lg no-select active:opacity-70 flex items-center justify-center rounded-full"
                      style={{ minHeight: 40, minWidth: 40 }}
                    >
                      🗑️
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          {/* 화이팅 상세 모달 */}
          <DetailModal open={!!viewCheering} onClose={() => setViewCheering(null)}>
            {viewCheering && (
              <>
                <div className="text-xs text-textsub mb-2">
                  {formatKoreanDate(viewCheering.date)}{viewCheering.mood ? ` · ${viewCheering.mood}` : ''}
                </div>
                <div
                  className="text-base leading-relaxed whitespace-pre-wrap text-textmain"
                  style={{ userSelect: 'text', WebkitUserSelect: 'text' }}
                >
                  {viewCheering.text}
                </div>

            {viewDiary && (

                </div>

                  className="text-base leading-relaxed whitespace-pre-wrap text-textmain mb-4"
                  style={{ userSelect: 'text', WebkitUserSelect: 'text' }}
                >

                {viewDiary.grateful && viewDiary.grateful.length > 0 && (
                  <div className="mb-4">
                    <div className="text-sm font-semibold text-primary mb-1">🙏 감사한 일</div>
                    <ul className="list-disc list-inside text-sm text-textmain space-y-1">
                      {viewDiary.grateful.map((g, i) => (
                        <li key={i}>{g}</li>

                {viewDiary.hard && (
                  <div>
                    <div className="text-sm font-semibold text-secondary mb-1">💙 힘들었던 점</div>
                    <div className="text-sm text-textmain whitespace-pre-wrap">{viewDiary.hard}</div>
                  </div>
                )}
              </>
            )}
          </DetailModal>

          <ConfirmDialog
            open={!!deleteId}
            title="일기를 삭제할까요?"
            message="삭제한 일기는 복구할 수 없어요."
            onConfirm={handleDelete}
            onCancel={() => setDeleteId(null)}
          />
        </div>
      );
    }

    // ========== 탭 5: 병원비 관리 ==========
    const EXPENSE_CATEGORIES = ['진료비', '약제비', '검사비', '입원비', '기타'];
    const PAYMENT_METHODS = ['현금', '카드', '실비청구'];
    const CATEGORY_COLORS = ['#E91E8C', '#6C63FF', '#10B981', '#F59E0B', '#EF4444'];

    // ========== 5-3 대시보드 차트 ==========
    function ExpenseDashboard({ expenses }) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = now.getMonth();
      const thisMonthKey = `${yyyy}-${String(mm + 1).padStart(2, '0')}`;

      // 이번 달 지출만 필터
      const thisMonthExpenses = useMemo(
        () => expenses.filter((e) => (e.date || '').startsWith(thisMonthKey)),
        [expenses, thisMonthKey]
      );

      // PieChart 데이터: 이번 달 카테고리별 합계
      const pieData = useMemo(() => {
        const map = Object.fromEntries(EXPENSE_CATEGORIES.map((c) => [c, 0]));
        thisMonthExpenses.forEach((e) => {
          if (map[e.category] !== undefined) {
            map[e.category] += Number(e.amount) || 0;
          }
        });
        return EXPENSE_CATEGORIES
          .map((c) => ({ name: c, value: map[c] }))
          .filter((d) => d.value > 0);
      }, [thisMonthExpenses]);

      const monthTotal = useMemo(
        () => thisMonthExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0),
        [thisMonthExpenses]
      );

      // BarChart 데이터: 전체 기간 청구 vs 본인부담
      const barData = useMemo(() => {
        let claim = 0;
        let self = 0;
        expenses.forEach((e) => {
          const amt = Number(e.amount) || 0;
          if (e.payment === '실비청구') claim += amt;
          else self += amt;
        });
        return [
          { name: '실비청구', amount: claim, fill: '#6C63FF' },
          { name: '본인부담', amount: self, fill: '#E91E8C' },
        ];
      }, [expenses]);

      // LineChart 데이터: 최근 6개월 월별 합계
      const lineData = useMemo(() => {
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(yyyy, mm - i, 1);
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          months.push({ key, month: key, total: 0 });
        }
        const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
        expenses.forEach((e) => {
          const k = (e.date || '').slice(0, 7);
          if (idx[k] !== undefined) {
            months[idx[k]].total += Number(e.amount) || 0;
          }
        });
        return months;
      }, [expenses, yyyy, mm]);

      // 금액 축 포맷 (만 단위 축약)
      const tickFormatMoney = (v) => {
        if (v >= 10000) return `${Math.round(v / 10000)}만`;
        return v;
      };

      return (
        <Card title="📈 요약 대시보드">
          {/* 차트 1: 이번 달 카테고리별 도넛 */}
          <div className="mb-6">
            <div className="text-xs text-textsub mb-2">이번 달 카테고리별 지출</div>
            <div className="relative">
              <ResponsiveContainer width="100%" height={200}>
                <PieChart>
                  <Pie
                    data={pieData.length > 0 ? pieData : [{ name: '데이터 없음', value: 1 }]}
                    dataKey="value"
                    nameKey="name"
                    cx="50%"
                    cy="50%"
                    innerRadius={55}
                    outerRadius={85}
                    paddingAngle={pieData.length > 1 ? 2 : 0}
                    isAnimationActive={false}
                  >
                    {(pieData.length > 0 ? pieData : [{ name: '데이터 없음' }]).map((entry, i) => (
                      <Cell
                        key={i}
                        fill={pieData.length > 0 ? CATEGORY_COLORS[i % CATEGORY_COLORS.length] : '#E5E7EB'}
                      />
                    ))}
                  </Pie>
                  {pieData.length > 0 && (
                    <Tooltip formatter={(v) => `${formatWithComma(v)}원`} />
                  )}
                </PieChart>
              </ResponsiveContainer>
              <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
                <div className="text-[11px] text-textsub">이번 달 총액</div>
                <div className="text-base font-bold text-primary">
                  {formatWithComma(monthTotal)}원
                </div>
              </div>
            </div>
            {pieData.length > 0 ? (
              <div className="flex flex-wrap gap-x-3 gap-y-1 justify-center mt-2">
                {pieData.map((d, i) => (
                  <div key={d.name} className="flex items-center gap-1 text-xs">
                    <span
                      className="inline-block w-2.5 h-2.5 rounded-full"
                      style={{ backgroundColor: CATEGORY_COLORS[i % CATEGORY_COLORS.length] }}
                    />
                    <span className="text-textsub">
                      {d.name} {formatWithComma(d.value)}원
                    </span>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center text-xs text-textsub mt-2">
                이번 달 지출 기록이 없어요.
              </div>
            )}
          </div>

          {/* 차트 2: 청구 vs 본인부담 */}
          <div className="mb-6">
            <div className="text-xs text-textsub mb-2">청구 vs 본인부담 (전체 기간)</div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={barData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                <XAxis dataKey="name" tick={{ fontSize: 12, fill: '#6B7280' }} />
                <YAxis
                  tick={{ fontSize: 11, fill: '#6B7280' }}
                  tickFormatter={tickFormatMoney}
                  width={48}
                />
                <Tooltip formatter={(v) => `${formatWithComma(v)}원`} />
                <Bar dataKey="amount" radius={[8, 8, 0, 0]} isAnimationActive={false}>
                  {barData.map((entry, i) => (
                    <Cell key={i} fill={entry.fill} />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* 차트 3: 월별 추이 */}
          <div>
            <div className="text-xs text-textsub mb-2">월별 지출 추이 (최근 6개월)</div>
            <ResponsiveContainer width="100%" height={200}>
              <LineChart data={lineData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                <XAxis dataKey="month" tick={{ fontSize: 10, fill: '#6B7280' }} />
                <YAxis
                  tick={{ fontSize: 11, fill: '#6B7280' }}
                  tickFormatter={tickFormatMoney}
                  width={48}
                />
                <Tooltip formatter={(v) => `${formatWithComma(v)}원`} />
                <Line
                  type="monotone"
                  dataKey="total"
                  stroke="#E91E8C"
                  strokeWidth={2.5}
                  dot={{ r: 4, fill: '#E91E8C' }}
                  activeDot={{ r: 6 }}
                  isAnimationActive={false}
                />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </Card>
      );
    }

    function formatWithComma(digitsOnly) {
      if (!digitsOnly) return '';
      return Number(digitsOnly).toLocaleString('ko-KR');
    }
    function parseMoney(str) {
      const digits = String(str || '').replace(/[^\d]/g, '');
      return digits ? Number(digits) : 0;
    }
    function handleCommaInput(value, setter) {
      const digits = String(value).replace(/[^\d]/g, '');
      setter(formatWithComma(digits));
    }

    function ExpenseTab() {
      const [expenses, setExpenses] = useState(() => loadData(STORAGE_KEYS.expenses, []));
      const [insurances, setInsurances] = useState(() => loadData(STORAGE_KEYS.insurance, []));

      // 지출 입력 폼
      const [eDate, setEDate] = useState(todayKey());
      const [eItem, setEItem] = useState('');
      const [eAmount, setEAmount] = useState('');
      const [eCategory, setECategory] = useState(EXPENSE_CATEGORIES[0]);
      const [ePayment, setEPayment] = useState(PAYMENT_METHODS[1]);

      // 보험 입력 폼
      const [showInsuranceForm, setShowInsuranceForm] = useState(false);
      const [iCompany, setICompany] = useState('');
      const [iType, setIType] = useState('');
      const [iLimit, setILimit] = useState('');
      const [iReceived, setIReceived] = useState('');

      // 삭제 확인
      const [deleteExpenseId, setDeleteExpenseId] = useState(null);
      const [deleteInsuranceId, setDeleteInsuranceId] = useState(null);

      useEffect(() => saveData(STORAGE_KEYS.expenses, expenses), [expenses]);
      useEffect(() => saveData(STORAGE_KEYS.insurance, insurances), [insurances]);

      function handleSaveExpense() {
        const amount = parseMoney(eAmount);
        if (!eItem.trim() || amount <= 0) return;
        const entry = {
          id: generateId(),
          date: eDate,
          item: eItem.trim(),
          amount,
          category: eCategory,
          payment: ePayment,
        };
        setExpenses((prev) => [entry, ...prev]);
        setEItem('');
        setEAmount('');
      }

      function handleSaveInsurance() {
        const limit = parseMoney(iLimit);
        const received = parseMoney(iReceived);
        if (!iCompany.trim() || limit <= 0) return;
        const entry = {
          id: generateId(),
          company: iCompany.trim(),
          type: iType.trim(),
          limit,
          received,
        };
        setInsurances((prev) => [entry, ...prev]);
        setICompany('');
        setIType('');
        setILimit('');
        setIReceived('');
        setShowInsuranceForm(false);
      }

      function handleDeleteExpense() {
        setExpenses((prev) => prev.filter((x) => x.id !== deleteExpenseId));
        setDeleteExpenseId(null);
      }
      function handleDeleteInsurance() {
        setInsurances((prev) => prev.filter((x) => x.id !== deleteInsuranceId));
        setDeleteInsuranceId(null);
      }

      const sortedExpenses = useMemo(
        () => [...expenses].sort((a, b) => (b.date || '').localeCompare(a.date || '')),
        [expenses]
      );

      return (
        <div className="px-4 pb-6 space-y-4">
          {/* 5-1. 병원비 입력 */}
          <Card title="💰 병원비 입력">
            <label className="block text-xs text-textsub mb-1">날짜</label>
            <input
              type="date"
              value={eDate}
              onChange={(e) => setEDate(e.target.value)}
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain"
            />

            <label className="block text-xs text-textsub mb-1">항목명</label>
            <input
              type="text"
              value={eItem}
              onChange={(e) => setEItem(e.target.value)}
              placeholder="예) 외래 진료, CT 검사"
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain placeholder:text-textsub/70"
            />

            <label className="block text-xs text-textsub mb-1">금액 (원)</label>
            <input
              type="text"
              inputMode="numeric"
              value={eAmount}
              onChange={(e) => handleCommaInput(e.target.value, setEAmount)}
              placeholder="0"
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain placeholder:text-textsub/70 text-right"
            />

            <label className="block text-xs text-textsub mb-1">카테고리</label>
            <div className="flex flex-wrap gap-2 mb-3">
              {EXPENSE_CATEGORIES.map((c) => {
                const active = eCategory === c;
                return (
                  <button
                    key={c}
                    onClick={() => setECategory(c)}
                    className={`no-select rounded-full px-3 py-2 text-sm
                                ${active
                                  ? 'bg-primary text-white font-semibold'
                                  : 'bg-softbg text-textsub border border-primary/20'}`}
                    style={{ minHeight: 36 }}
                  >
                    {c}
                  </button>
                );
              })}
            </div>

            <label className="block text-xs text-textsub mb-1">결제방법</label>
            <div className="flex gap-2 mb-4">
              {PAYMENT_METHODS.map((p) => {
                const active = ePayment === p;
                return (
                  <button
                    key={p}
                    onClick={() => setEPayment(p)}
                    className={`no-select flex-1 rounded-full px-3 py-2 text-sm
                                ${active
                                  ? 'bg-secondary text-white font-semibold'
                                  : 'bg-softbg text-textsub border border-secondary/30'}`}
                    style={{ minHeight: 36 }}
                  >
                    {p}
                  </button>
                );
              })}
            </div>

            <div className="flex justify-end">
              <PrimaryButton
                onClick={handleSaveExpense}
                disabled={!eItem.trim() || parseMoney(eAmount) <= 0}
              >
                지출 저장
              </PrimaryButton>
            </div>
          </Card>

          {/* 지출 리스트 */}
          <Card title="📒 저장된 지출">
            {sortedExpenses.length === 0 ? (
              <div className="py-6 text-center text-sm text-textsub">
                아직 저장된 지출이 없어요.
              </div>
            ) : (
              <ul className="divide-y divide-primary/10">
                {sortedExpenses.map((ex) => (
                  <li key={ex.id} className="py-3 flex items-center gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="text-xs text-textsub mb-0.5">
                        {ex.date} · {ex.category} · {ex.payment}
                      </div>
                      <div className="text-sm text-textmain truncate">{ex.item}</div>
                    </div>
                    <div className="text-sm font-semibold text-primary whitespace-nowrap">
                      {formatWithComma(ex.amount)}원
                    </div>
                    <button
                      onClick={() => setDeleteExpenseId(ex.id)}
                      aria-label="삭제"
                      className="text-lg no-select active:opacity-70 flex items-center justify-center rounded-full"
                      style={{ minHeight: 40, minWidth: 40 }}
                    >
                      🗑️
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </Card>

          {/* 5-2. 보험 / 실비 한도 */}
          <Card title="🏦 보험 / 실비 한도">
            {insurances.length === 0 ? (
              <div className="py-4 text-center text-sm text-textsub">
                등록된 보험이 없어요.
              </div>
            ) : (
              <ul className="space-y-3">
                {insurances.map((ins) => {
                  const limit = Number(ins.limit) || 0;
                  const received = Number(ins.received) || 0;
                  const remaining = Math.max(limit - received, 0);
                  const remainingPct = limit > 0 ? (remaining / limit) * 100 : 0;
                  let barColor = '#10B981';
                  if (remainingPct < 30) barColor = '#EF4444';
                  else if (remainingPct < 70) barColor = '#F59E0B';
                  return (
                    <li key={ins.id} className="rounded-xl border border-primary/10 p-3">
                      <div className="flex items-start gap-2 mb-2">
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-semibold text-textmain truncate">
                            {ins.company}
                            {ins.type ? <span className="text-textsub font-normal"> · {ins.type}</span> : null}
                          </div>
                          <div className="text-xs text-textsub mt-0.5">
                            한도 {formatWithComma(limit)}원 · 수령 {formatWithComma(received)}원
                          </div>
                        </div>
                        <button
                          onClick={() => setDeleteInsuranceId(ins.id)}
                          aria-label="삭제"
                          className="text-base no-select active:opacity-70 flex items-center justify-center rounded-full"
                          style={{ minHeight: 36, minWidth: 36 }}
                        >
                          🗑️
                        </button>
                      </div>
                      <div className="h-2.5 w-full rounded-full bg-softbg overflow-hidden">
                        <div
                          className="h-full rounded-full transition-all"
                          style={{
                            width: `${Math.min(Math.max(remainingPct, 0), 100)}%`,
                            backgroundColor: barColor,
                          }}
                        />
                      </div>
                      <div className="flex justify-between mt-1 text-[11px] text-textsub">
                        <span>잔여 {formatWithComma(remaining)}원</span>
                        <span style={{ color: barColor }}>
                          {remainingPct.toFixed(1)}% 남음
                        </span>
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}

            {showInsuranceForm ? (
              <div className="mt-4 space-y-3 rounded-xl border border-primary/20 p-3 bg-softbg">
                <div>
                  <label className="block text-xs text-textsub mb-1">보험사명</label>
                  <input
                    type="text"
                    value={iCompany}
                    onChange={(e) => setICompany(e.target.value)}
                    placeholder="예) OO생명"
                    className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain placeholder:text-textsub/70"
                  />
                </div>
                <div>
                  <label className="block text-xs text-textsub mb-1">보험 종류</label>
                  <input
                    type="text"
                    value={iType}
                    onChange={(e) => setIType(e.target.value)}
                    placeholder="예) 실손, 암보험"
                    className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain placeholder:text-textsub/70"
                  />
                </div>
                <div>
                  <label className="block text-xs text-textsub mb-1">총 한도 금액 (원)</label>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={iLimit}
                    onChange={(e) => handleCommaInput(e.target.value, setILimit)}
                    placeholder="0"
                    className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain placeholder:text-textsub/70 text-right"
                  />
                </div>
                <div>
                  <label className="block text-xs text-textsub mb-1">이미 수령한 금액 (원)</label>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={iReceived}
                    onChange={(e) => handleCommaInput(e.target.value, setIReceived)}
                    placeholder="0"
                    className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain placeholder:text-textsub/70 text-right"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-1">
                  <GhostButton onClick={() => {
                    setShowInsuranceForm(false);
                    setICompany(''); setIType(''); setILimit(''); setIReceived('');
                  }}>취소</GhostButton>
                  <PrimaryButton
                    onClick={handleSaveInsurance}
                    disabled={!iCompany.trim() || parseMoney(iLimit) <= 0}
                  >
                    보험 추가
                  </PrimaryButton>
                </div>
              </div>
            ) : (
              <div className="flex justify-end mt-3">
                <GhostButton onClick={() => setShowInsuranceForm(true)}>
                  + 보험 추가
                </GhostButton>
              </div>
            )}
          </Card>

          {/* 5-3. 요약 대시보드 */}
          <ExpenseDashboard expenses={expenses} />

          <ConfirmDialog
            open={!!deleteExpenseId}
            title="지출을 삭제할까요?"
            message="삭제한 지출 내역은 복구할 수 없어요."
            onConfirm={handleDeleteExpense}
            onCancel={() => setDeleteExpenseId(null)}
          />
          <ConfirmDialog
            open={!!deleteInsuranceId}
            title="보험 정보를 삭제할까요?"
            message="삭제한 보험 한도 정보는 복구할 수 없어요."
            onConfirm={handleDeleteInsurance}
            onCancel={() => setDeleteInsuranceId(null)}
          />
        </div>
      );
    }

    // ========== 탭 placeholder ==========
    function Placeholder({ label }) {
      return (
        <div className="px-4 pb-6">
          <Card>
            <div className="py-10 text-center text-textsub text-sm">
              {label} 탭 준비 중…
            </div>
          </Card>
        </div>
      );
    }

    // ========== App ==========
    function App() {
      const [tab, setTab] = useState('home');

      const titleMap = {
        home: '오늘 기록',
        treatment: '치료 관리',
        body: '몸 상태',
        diary: '마음 일기',
        expense: '병원비 관리',
      };

      // 탭 전환 시 스크롤 최상단
      const scrollRef = useRef(null);
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = 0;
      }, [tab]);

      return (
        <div className="min-h-screen flex flex-col items-center">
          <div className="w-full max-w-[480px] min-h-screen flex flex-col bg-softbg relative">
            <Header title={titleMap[tab]} />
            <main
              ref={scrollRef}
              className="scroll-area flex-1 overflow-y-auto pt-3"
              style={{ paddingBottom: 'calc(72px + env(safe-area-inset-bottom))' }}
            >
              {tab === 'home'      && <HomeTab onNavigate={setTab} />}
              {tab === 'treatment' && <Placeholder label="치료 관리" />}
              {tab === 'body'      && <Placeholder label="몸 상태" />}
              {tab === 'diary'     && <DiaryTab />}
              {tab === 'expense'   && <ExpenseTab />}
            </main>
            <TabBar current={tab} onChange={setTab} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

              ) : (
                <span />
              )}
              <PrimaryButton onClick={handleSave}>저장</PrimaryButton>
            </div>

            <ConfirmDialog
              open={confirmDeleteOpen}
              title="이 날짜 기록을 삭제할까요?"

              onConfirm={handleDelete}
              onCancel={() => setConfirmDeleteOpen(false)}
            />

        </div>
      );
    }

    function TreatmentTab() {
      const [schedules, setSchedules] = useState(() => loadData(SCHEDULE_STORAGE_KEY, []));
      const [modalOpen, setModalOpen] = useState(false);
      const [deleteId, setDeleteId] = useState(null);
      const [notifyEnabled, setNotifyEnabled] = useState(() =>
        loadData('igt_notify_cycle', isNativeApp)
      );
      const [notifyMsg, setNotifyMsg] = useState('');
      const [recordDate, setRecordDate] = useState(null);
      // 일일 기록이 있는 날짜 Set — 캘린더에 점 표시 + 모달 저장 후 갱신
      const [recordedDates, setRecordedDates] = useState(() => {
        const all = loadData(DAILYRECORD_STORAGE_KEY, []);
        return new Set(all.map((r) => r.date));
      });
      function refreshRecordedDates() {
        const all = loadData(DAILYRECORD_STORAGE_KEY, []);
        setRecordedDates(new Set(all.map((r) => r.date)));
      }

      useEffect(() => {
        saveData(SCHEDULE_STORAGE_KEY, schedules);
      }, [schedules]);
      useEffect(() => {
        saveData('igt_notify_cycle', notifyEnabled);
      }, [notifyEnabled]);

      async function handleSaveSchedule(entry) {
        setSchedules((prev) => [entry, ...prev]);
        setModalOpen(false);
        if (notifyEnabled && isNativeApp) {
          const r = await scheduleCycleReminder(entry);
          if (r.ok) {
            setNotifyMsg(`🔔 알림 ${r.count}건 예약됨 (시작일 09:00 + 하루 전 21:00)`);
          } else if (r.reason === 'permission-denied') {
            setNotifyMsg('알림 권한이 거부되어 예약하지 못했어요.');
          } else if (r.reason === 'past') {
            setNotifyMsg('시작일이 이미 지나서 알림은 예약하지 않았어요.');
          }
          setTimeout(() => setNotifyMsg(''), 4000);
        }
      }
      async function handleDelete() {
        const id = deleteId;
        await cancelCycleReminder(id);
        setSchedules((prev) => prev.filter((s) => s.id !== id));
        setDeleteId(null);
      }
      async function handleToggleNotify(next) {
        setNotifyEnabled(next);
        if (next && isNativeApp) {
          const granted = await ensureNotificationPermission();
          if (!granted) {
            setNotifyMsg('알림 권한이 필요해요. 시스템 설정에서 허용해주세요.');
            setNotifyEnabled(false);
            setTimeout(() => setNotifyMsg(''), 4000);
            return;
          }
          // 기존 스케줄에도 일괄 적용 (미래 일정만)
          let count = 0;
          for (const s of schedules) {
            const r = await scheduleCycleReminder(s);
            if (r.ok) count += r.count;
          }
          if (count > 0) {
            setNotifyMsg(`🔔 기존 스케줄 ${count}건 알림 재예약 완료`);
            setTimeout(() => setNotifyMsg(''), 4000);
          }
        } else if (!next && isNativeApp) {
          for (const s of schedules) await cancelCycleReminder(s.id);
        }
      }

      const sorted = useMemo(
        () =>
          [...schedules].sort((a, b) =>
            (b.startDate || '').localeCompare(a.startDate || '')
          ),
        [schedules]
      );

      return (
        <div className="px-4 pb-6 space-y-4">
          <ScheduleCalendar
            schedules={schedules}
            recordedDates={recordedDates}
            onDateClick={(d) => setRecordDate(d)}
          />
          <ProgressCard schedules={schedules} />

          {/* 알림 설정 (Capacitor 네이티브에서만 동작) */}
          <Card>
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1">
                <div className="text-sm font-bold text-textmain mb-1">🔔 사이클 알림</div>
                <div className="text-xs text-textsub leading-relaxed">
                  {isNativeApp
                    ? '시작일 하루 전 21시 + 시작일 09시에 알림을 보내드려요.'
                    : '⚠️ 알림은 설치된 앱(iOS/Android)에서만 동작해요. PWA 설치 또는 Capacitor 빌드 후 사용하세요.'}
                </div>
              </div>
              <button
                onClick={() => handleToggleNotify(!notifyEnabled)}
                disabled={!isNativeApp}
                aria-label="사이클 알림 토글"
                className={`relative inline-flex shrink-0 rounded-full transition-colors no-select
                  ${notifyEnabled ? 'bg-primary' : 'bg-gray-300'}
                  ${!isNativeApp ? 'opacity-40' : ''}`}
                style={{ width: 50, height: 30, minHeight: 30 }}
              >
                <span
                  className="bg-white rounded-full shadow"
                  style={{
                    width: 24,
                    height: 24,
                    margin: 3,
                    transform: notifyEnabled ? 'translateX(20px)' : 'translateX(0)',
                    transition: 'transform 0.15s',
                  }}
                />
              </button>
            </div>
            {notifyMsg && (
              <div className="mt-3 text-xs text-primary bg-primary/5 rounded-lg px-3 py-2">
                {notifyMsg}
              </div>
            )}
          </Card>

          <MedReminderCard />

          <Card title="💊 항암 치료 스케줄">
            <div className="text-xs text-textsub mb-3 leading-relaxed">
              레지멘과 시작일을 등록해두면 사이클 일정이 기록됩니다.
            </div>

            {sorted.length === 0 ? (
              <div className="py-6 text-center text-sm text-textsub">
                아직 등록된 스케줄이 없어요.
              </div>
            ) : (
              <ul className="space-y-2 mb-4">
                {sorted.map((s) => {
                  const meta = CATEGORY_META[s.category] || { emoji: '💊', label: '' };
                  return (
                    <li
                      key={s.id}
                      className="rounded-xl border border-primary/15 p-3 flex items-start gap-2"
                    >
                      <div className="flex-1 min-w-0">
                        <div className="text-xs text-textsub mb-0.5">
                          {meta.emoji} {meta.label} · {s.cycleNumber}차
                        </div>
                        <div className="text-sm font-semibold text-textmain truncate">
                          {s.regimen}
                        </div>
                        <div className="text-xs text-textmain/80 mt-1">
                          {s.startDate} 시작 · {s.infusionDays}일 투여 · {s.cycleDays}일 주기
                        </div>
                        {s.memo && (
                          <div className="text-xs text-textsub mt-1 whitespace-pre-wrap">
                            {s.memo}
                          </div>
                        )}
                      </div>
                      <button
                        onClick={() => setDeleteId(s.id)}
                        aria-label="삭제"
                        className="text-lg no-select active:opacity-70 flex items-center justify-center rounded-full"
                        style={{ minHeight: 40, minWidth: 40 }}
                      >
                        🗑️
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}

            <div className="flex justify-end">
              <PrimaryButton onClick={() => setModalOpen(true)}>
                + 항암 스케줄 추가
              </PrimaryButton>
            </div>
          </Card>

          <RegimenScheduleModal
            open={modalOpen}
            onClose={() => setModalOpen(false)}
            onSave={handleSaveSchedule}
          />

          <DailyRecordModal
            open={!!recordDate}
            date={recordDate}
            onClose={() => setRecordDate(null)}
            onSaved={refreshRecordedDates}
          />

          <ConfirmDialog
            open={!!deleteId}
            title="스케줄을 삭제할까요?"
            message="삭제한 스케줄은 복구할 수 없어요."
            onConfirm={handleDelete}
            onCancel={() => setDeleteId(null)}
          />
        </div>
      );
    }

    // ========== 탭 placeholder ==========
    // ========== 탭 3: 몸 상태 ==========
    // 키 → igt_profile.height (1회 등록 후 자동 로드, 수정 가능)
    // 체중 측정 → igt_vitals 에 누적 (date, weight, bsa, bmi)
    // BSA: Mosteller 공식  √(키 × 체중 / 3600)
    // BMI: 체중 / (키[m])²
    function bmiCategory(bmi) {
      if (bmi == null || isNaN(bmi)) return null;
      if (bmi < 18.5) return { label: '저체중', cls: 'bg-blue-100 text-blue-700 border-blue-200' };
      if (bmi < 25)   return { label: '정상',   cls: 'bg-green-100 text-green-700 border-green-200' };
      if (bmi < 30)   return { label: '과체중', cls: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
      return { label: '비만', cls: 'bg-red-100 text-red-700 border-red-200' };
    }

    // ========== 증상 추이 차트 ==========
    // igt_dailyrecord에서 통증 NRS / 체온 / 구토 횟수를 시계열로 시각화
    function SymptomTrendsCard() {
      const records = loadData(DAILYRECORD_STORAGE_KEY, []);

      // 최근 30일 분 정렬
      const sorted = useMemo(() => {
        return [...records]
          .filter((r) => r && r.date)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(-30);
      }, [records]);

      // X축 라벨: MM/DD
      function fmt(d) { return d.slice(5).replace('-', '/'); }

      const painData = useMemo(
        () => sorted
          .filter((r) => Number((r.sideEffects || {}).pain) > 0)
          .map((r) => ({ date: fmt(r.date), pain: Number(r.sideEffects.pain) })),
        [sorted]
      );

      const feverData = useMemo(
        () => sorted
          .filter((r) => r.fever !== null && r.fever !== undefined && Number(r.fever) > 0)
          .map((r) => ({ date: fmt(r.date), fever: Number(r.fever) })),
        [sorted]
      );

      const vomitData = useMemo(
        () => sorted
          .filter((r) => Number(r.vomitCount) > 0)
          .map((r) => ({ date: fmt(r.date), count: Number(r.vomitCount) })),
        [sorted]
      );

      if (painData.length === 0 && feverData.length === 0 && vomitData.length === 0) {
        return null;
      }

      return (
        <Card title="📊 증상 추이 (최근 30일)">
          {/* 통증 NRS */}
          {painData.length > 0 && (
            <div className="mb-5">
              <div className="flex items-center justify-between mb-1">
                <div className="text-sm font-bold text-textmain">😖 통증 NRS</div>
                <span className="text-[11px] text-textsub">
                  최고 {Math.max(...painData.map((d) => d.pain))} / 평균{' '}
                  {(painData.reduce((a, b) => a + b.pain, 0) / painData.length).toFixed(1)}
                </span>
              </div>
              <ResponsiveContainer width="100%" height={170}>
                <LineChart data={painData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                  <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#6B7280' }} />
                  <YAxis
                    domain={[0, 10]}
                    ticks={[0, 2, 4, 6, 8, 10]}
                    tick={{ fontSize: 11, fill: '#6B7280' }}
                    width={28}
                  />
                  <Tooltip formatter={(v) => `NRS ${v}`} />
                  <ReferenceLine y={4} stroke="#F59E0B" strokeDasharray="4 4" label={{ value: '중등도 4', position: 'right', fontSize: 9, fill: '#F59E0B' }} />
                  <ReferenceLine y={7} stroke="#EF4444" strokeDasharray="4 4" label={{ value: '심함 7', position: 'right', fontSize: 9, fill: '#EF4444' }} />
                  <Line
                    type="monotone"
                    dataKey="pain"
                    name="통증"
                    stroke="#E91E8C"
                    strokeWidth={2.5}
                    dot={{ r: 4, fill: '#E91E8C' }}
                    activeDot={{ r: 6 }}
                    isAnimationActive={false}
                  />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          {/* 체온 */}
          {feverData.length > 0 && (
            <div className="mb-5">
              <div className="flex items-center justify-between mb-1">
                <div className="text-sm font-bold text-textmain">🌡️ 체온</div>
                <span className="text-[11px] text-textsub">
                  최고 {Math.max(...feverData.map((d) => d.fever)).toFixed(1)}°C
                </span>
              </div>
              <ResponsiveContainer width="100%" height={170}>
                <LineChart data={feverData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                  <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#6B7280' }} />
                  <YAxis
                    domain={[35, 'dataMax + 0.5']}
                    tick={{ fontSize: 11, fill: '#6B7280' }}
                    width={32}
                    tickFormatter={(v) => `${v}°`}
                  />
                  <Tooltip formatter={(v) => `${Number(v).toFixed(1)}°C`} />
                  <ReferenceLine y={38} stroke="#EF4444" strokeDasharray="4 4" label={{ value: '발열 38°', position: 'right', fontSize: 9, fill: '#EF4444' }} />
                  <Line
                    type="monotone"
                    dataKey="fever"
                    name="체온"
                    stroke="#EF4444"
                    strokeWidth={2.5}
                    dot={{ r: 4, fill: '#EF4444' }}
                    activeDot={{ r: 6 }}
                    isAnimationActive={false}
                  />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          {/* 구토 빈도 */}
          {vomitData.length > 0 && (
            <div>
              <div className="flex items-center justify-between mb-1">
                <div className="text-sm font-bold text-textmain">🤮 구토 빈도</div>
                <span className="text-[11px] text-textsub">
                  총 {vomitData.reduce((a, b) => a + b.count, 0)}회 / {vomitData.length}일
                </span>
              </div>
              <ResponsiveContainer width="100%" height={170}>
                <BarChart data={vomitData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                  <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#6B7280' }} />
                  <YAxis
                    allowDecimals={false}
                    tick={{ fontSize: 11, fill: '#6B7280' }}
                    width={28}
                  />
                  <Tooltip formatter={(v) => `${v}회`} />
                  <Bar
                    dataKey="count"
                    name="구토 횟수"
                    fill="#10B981"
                    radius={[6, 6, 0, 0]}
                    isAnimationActive={false}
                  />
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}

          <div className="text-[11px] text-textsub mt-3 leading-relaxed">
            ※ 캘린더 날짜를 탭해서 그날 기록을 추가하면 차트가 자동으로 업데이트돼요.
          </div>
        </Card>
      );
    }

    function BodyTab() {
      const [vitals, setVitals] = useState(() => loadData('igt_vitals', []));
      const [profile, setProfile] = useState(() => loadData('igt_profile', {}));
      const [height, setHeight] = useState(profile.height ? String(profile.height) : '');
      const [weight, setWeight] = useState('');
      const [showResult, setShowResult] = useState(false);
      const [savedMsg, setSavedMsg] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      useEffect(() => {
        saveData('igt_vitals', vitals);
      }, [vitals]);

      const heightNum = Number(height) || 0;
      const weightNum = Number(weight) || 0;
      const valid = heightNum > 0 && weightNum > 0;
      const bsa = valid ? Number(Math.sqrt((heightNum * weightNum) / 3600).toFixed(2)) : null;
      const bmi = valid ? Number((weightNum / Math.pow(heightNum / 100, 2)).toFixed(1)) : null;
      const cat = bmiCategory(bmi);

      function showMsg(m, ms = 3500) {
        setSavedMsg(m);
        setTimeout(() => setSavedMsg(''), ms);
      }

      function handleCalc() {
        if (!valid) return;
        setShowResult(true);
        // 키는 즉시 프로필에 반영 (다음 진입에서 자동 로드)
        if (heightNum !== Number(profile.height)) {
          const next = { ...profile, height: heightNum };
          saveData('igt_profile', next);
          setProfile(next);
        }
      }

      function handleSave() {
        if (!valid) return;
        if (heightNum !== Number(profile.height)) {
          const next = { ...profile, height: heightNum };
          saveData('igt_profile', next);
          setProfile(next);
        }
        const today = todayKey();
        const entry = {
          id: generateId(),
          date: today,
          weight: weightNum,
          bsa,
          bmi,
        };
        setVitals((prev) => {
          const without = prev.filter((v) => v.date !== today);
          return [entry, ...without];
        });
        setWeight('');
        setShowResult(false);
        showMsg(`✅ ${today} 측정 저장됨 · BSA ${bsa} m² · BMI ${bmi}`);
      }

      function handleDelete() {
        setVitals((prev) => prev.filter((v) => v.id !== confirmDeleteId));
        setConfirmDeleteId(null);
      }

      // 체중 추이용 (최근 10회, 날짜 오름차순)
      const chartData = useMemo(() => {
        return [...vitals]
          .filter((v) => v.date && Number(v.weight) > 0)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(-10)
          .map((v) => ({
            date: v.date.slice(5).replace('-', '/'), // MM/DD
            weight: Number(v.weight),
            bsa: Number(v.bsa) || null,
          }));
      }, [vitals]);

      const change = useMemo(() => {
        if (chartData.length < 2) return null;
        const last = chartData[chartData.length - 1].weight;
        const prev = chartData[chartData.length - 2].weight;
        const diff = last - prev;
        if (Math.abs(diff) < 0.05) return { direction: 'same', diff: '0.0' };
        return {
          direction: diff > 0 ? 'up' : 'down',
          diff: Math.abs(diff).toFixed(1),
        };
      }, [chartData]);

      const sortedVitals = useMemo(
        () => [...vitals].sort((a, b) => (b.date || '').localeCompare(a.date || '')),
        [vitals]
      );

      return (
        <div className="px-4 pb-6 space-y-4">
          {/* 3-1. 신체 계측 */}
          <Card title="🏥 신체 계측">
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label className="block text-xs text-textsub mb-1">키 (cm)</label>
                <input
                  type="number"
                  inputMode="decimal"
                  step="0.1"
                  min="50"
                  max="250"
                  value={height}
                  onChange={(e) => setHeight(e.target.value)}
                  placeholder="170"
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70"
                />
              </div>
              <div>
                <label className="block text-xs text-textsub mb-1">체중 (kg)</label>
                <input
                  type="number"
                  inputMode="decimal"
                  step="0.1"
                  min="20"
                  max="200"
                  value={weight}
                  onChange={(e) => setWeight(e.target.value)}
                  placeholder="65"
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70"
                />
              </div>
            </div>

            <div className="flex gap-2 mb-3">
              <GhostButton onClick={handleCalc}>🧮 BSA 계산</GhostButton>
            </div>

            {showResult && bsa !== null && (
              <div className="rounded-xl border-2 border-primary/30 bg-yellow-50 p-3 mb-3">
                <div className="text-[11px] text-textsub mb-1">
                  Mosteller: √(키 × 체중 / 3600)
                </div>
                <div className="text-2xl font-extrabold text-primary leading-none">
                  BSA {bsa} <span className="text-base">m²</span>
                </div>
                {bmi !== null && (
                  <div className="flex items-center gap-2 mt-3">
                    <div className="text-sm text-textmain">
                      BMI <b>{bmi}</b>
                    </div>
                    {cat && (
                      <span
                        className={`text-xs rounded-full px-2 py-0.5 font-semibold border ${cat.cls}`}
                      >
                        {cat.label}
                      </span>
                    )}
                  </div>
                )}
              </div>
            )}

            <div className="flex justify-end">
              <PrimaryButton onClick={handleSave} disabled={!valid}>
                오늘 측정 저장
              </PrimaryButton>
            </div>

            {savedMsg && (
              <div className="mt-3 text-xs text-textmain bg-primary/5 border border-primary/15 rounded-lg px-3 py-2">
                {savedMsg}
              </div>
            )}

            {profile.height && (
              <div className="mt-3 text-[11px] text-textsub">
                💡 마지막 등록 키: {profile.height}cm — 위 입력란에 자동 로드됩니다.
              </div>
            )}
          </Card>

          {/* 3-2. 체중 추이 */}
          <Card title={`📈 체중 추이${chartData.length >= 2 ? ` (최근 ${chartData.length}회)` : ''}`}>
            {chartData.length < 2 ? (
              <div className="py-6 text-center text-sm text-textsub">
                {chartData.length === 1
                  ? '측정을 한 번 더 저장하면 추이 차트가 표시돼요.'
                  : '체중 측정을 저장하면 추이가 기록됩니다.'}
              </div>
            ) : (
              <>
                {change && (
                  <div className="flex justify-end mb-2">
                    <span
                      className={`text-xs rounded-full px-2.5 py-1 font-semibold ${
                        change.direction === 'down'
                          ? 'bg-blue-100 text-blue-700'
                          : change.direction === 'up'
                          ? 'bg-orange-100 text-orange-700'
                          : 'bg-gray-100 text-gray-700'
                      }`}
                    >
                      지난 측정 대비{' '}
                      {change.direction === 'down'
                        ? `−${change.diff}kg ▼`
                        : change.direction === 'up'
                        ? `+${change.diff}kg ▲`
                        : '변화 없음 ─'}
                    </span>
                  </div>
                )}
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart
                    data={chartData}
                    margin={{ top: 10, right: 10, left: 0, bottom: 0 }}
                  >
                    <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                    <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#6B7280' }} />
                    <YAxis
                      yAxisId="weight"
                      tick={{ fontSize: 11, fill: '#E91E8C' }}
                      domain={['dataMin - 1', 'dataMax + 1']}
                      width={36}
                    />
                    <YAxis
                      yAxisId="bsa"
                      orientation="right"
                      tick={{ fontSize: 11, fill: '#6C63FF' }}
                      domain={['dataMin - 0.1', 'dataMax + 0.1']}
                      width={36}
                    />
                    <Tooltip
                      formatter={(v, name) => {
                        if (name === '체중') return `${v} kg`;
                        if (name === 'BSA') return `${v} m²`;
                        return v;
                      }}
                    />
                    <Line
                      yAxisId="weight"
                      type="monotone"
                      dataKey="weight"
                      name="체중"
                      stroke="#E91E8C"
                      strokeWidth={2.5}
                      dot={{ r: 4, fill: '#E91E8C' }}
                      activeDot={{ r: 6 }}
                      isAnimationActive={false}
                    />
                    <Line
                      yAxisId="bsa"
                      type="monotone"
                      dataKey="bsa"
                      name="BSA"
                      stroke="#6C63FF"
                      strokeWidth={2}
                      strokeDasharray="4 4"
                      dot={{ r: 3, fill: '#6C63FF' }}
                      isAnimationActive={false}
                    />
                  </LineChart>
                </ResponsiveContainer>
                <div className="flex gap-4 justify-center mt-1 text-[11px] text-textsub">
                  <span>
                    <span className="inline-block w-2.5 h-2.5 rounded-full bg-primary mr-1" />
                    체중 (kg)
                  </span>
                  <span>
                    <span className="inline-block w-2.5 h-2.5 rounded-full bg-secondary mr-1" />
                    BSA (m²)
                  </span>
                </div>
              </>
            )}
          </Card>

          {/* 증상 추이 차트 (통증/체온/구토) */}
          <SymptomTrendsCard />

          {/* 측정 기록 리스트 */}
          <Card title="📋 측정 기록">
            {sortedVitals.length === 0 ? (
              <div className="py-3 text-center text-sm text-textsub">
                아직 저장된 기록이 없어요.
              </div>
            ) : (
              <ul className="divide-y divide-primary/10">
                {sortedVitals.map((v) => {
                  const c = bmiCategory(Number(v.bmi));
                  return (
                    <li key={v.id} className="py-3 flex items-center gap-2">
                      <div className="flex-1 min-w-0">
                        <div className="text-xs text-textsub mb-0.5">{v.date}</div>
                        <div className="text-sm text-textmain">
                          체중 <b>{v.weight}</b>kg · BSA <b>{v.bsa}</b> m² · BMI <b>{v.bmi}</b>
                          {c && (
                            <span className={`ml-2 text-[10px] rounded-full px-2 py-0.5 font-semibold border ${c.cls}`}>
                              {c.label}
                            </span>
                          )}
                        </div>
                      </div>
                      <button
                        onClick={() => setConfirmDeleteId(v.id)}
                        aria-label="삭제"
                        className="text-base no-select active:opacity-70 flex items-center justify-center rounded-full"
                        style={{ minHeight: 36, minWidth: 36 }}
                      >
                        🗑️
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>

          <ConfirmDialog
            open={!!confirmDeleteId}
            title="측정 기록을 삭제할까요?"
            message="복구할 수 없어요."
            onConfirm={handleDelete}
            onCancel={() => setConfirmDeleteId(null)}
          />
        </div>
      );
    }

    // ========== 탭 placeholder ==========
    function Placeholder({ label }) {
      return (
        <div className="px-4 pb-6">
          <Card>
            <div className="py-10 text-center text-textsub text-sm">
              {label} 탭 준비 중…
            </div>
          </Card>
        </div>
      );
    }

    // ========== App ==========
    function App() {
      const [tab, setTab] = useState('home');

      const titleMap = {
        home: '오늘 기록',
        treatment: '치료 관리',
        body: '몸 상태',
        diary: '마음 일기',
        expense: '병원비 관리',
      };

      // 탭 전환 시 스크롤 최상단
      const scrollRef = useRef(null);
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = 0;
      }, [tab]);

      return (
        <div className="min-h-screen flex flex-col items-center">
          <div className="w-full max-w-[480px] min-h-screen flex flex-col bg-softbg relative">
            <Header title={titleMap[tab]} />
            <main
              ref={scrollRef}
              className="scroll-area flex-1 overflow-y-auto pt-3"
              style={{ paddingBottom: 'calc(72px + env(safe-area-inset-bottom))' }}
            >
              {tab === 'home'      && <HomeTab onNavigate={setTab} />}
              {tab === 'treatment' && <TreatmentTab />}
              {tab === 'body'      && <BodyTab />}
              {tab === 'diary'     && <DiaryTab />}
              {tab === 'expense'   && <ExpenseTab />}
            </main>
            <TabBar current={tab} onChange={setTab} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

    // ========== Capacitor 네이티브 브릿지 헬퍼 ==========
    // 브라우저(PWA)에선 window.Capacitor가 없으므로 모든 호출에 안전 가드.
    const Caps = typeof window !== 'undefined' ? window.Capacitor : null;
    const isNativeApp = !!(Caps && Caps.isNativePlatform && Caps.isNativePlatform());
    const LocalNotifications = Caps && Caps.Plugins && Caps.Plugins.LocalNotifications;
    const Filesystem = Caps && Caps.Plugins && Caps.Plugins.Filesystem;
    const Share = Caps && Caps.Plugins && Caps.Plugins.Share;
    const PushNotifications = Caps && Caps.Plugins && Caps.Plugins.PushNotifications;

    // 푸시 알림 등록 (옵트인 시에만 호출)
    // 실제 서버에서 메시지를 받으려면 Firebase(google-services.json, Android) +
    // APNs Key/Provisioning Profile(iOS) + 백엔드 서버가 필요합니다.
    // 여기서는 토큰 발급 + 수신 핸들러만 wiring 하고, 토큰을 igt_push_token에 보관합니다.
    async function registerForPush() {
      if (!isNativeApp || !PushNotifications) return { ok: false, reason: 'not-native' };
      try {
        const perm = await PushNotifications.requestPermissions();
        if (perm.receive !== 'granted') {
          return { ok: false, reason: 'permission-denied' };
        }
        await PushNotifications.register();
        // 리스너는 한 번만 등록되도록 가드
        if (!window.__igtPushWired) {
          window.__igtPushWired = true;
          PushNotifications.addListener('registration', (token) => {
            try {
              localStorage.setItem('igt_push_token', token.value);
              console.info('[push] token:', token.value);
            } catch {}
          });
          PushNotifications.addListener('registrationError', (err) => {
            console.warn('[push] registrationError', err);
          });
          PushNotifications.addListener('pushNotificationReceived', (n) => {
            console.info('[push] received', n);
          });
          PushNotifications.addListener('pushNotificationActionPerformed', (a) => {
            console.info('[push] tapped', a);
          });
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, reason: 'error', error: e?.message };
      }
    }

    async function ensureNotificationPermission() {
      if (!isNativeApp || !LocalNotifications) return false;
      const cur = await LocalNotifications.checkPermissions();
      if (cur.display === 'granted') return true;
      const req = await LocalNotifications.requestPermissions();
      return req.display === 'granted';
    }

    // 스케줄에 대한 로컬 알림 ID는 결정적으로 생성 (재예약 시 같은 ID로 덮어쓰기)
    // Capacitor LocalNotifications id는 32-bit 정수만 허용하므로 hash → 양의 정수.
    function reminderIdForSchedule(scheduleId) {
      let h = 0;
      const str = 'sched-' + String(scheduleId);
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
      return Math.abs(h) % 2_000_000_000;
    }

    async function scheduleCycleReminder(schedule) {
      // 시작일 09:00 + 시작일 1일 전 21:00 두 개 예약
      if (!isNativeApp || !LocalNotifications) return { ok: false, reason: 'not-native' };
      const granted = await ensureNotificationPermission();
      if (!granted) return { ok: false, reason: 'permission-denied' };

      const baseId = reminderIdForSchedule(schedule.id);
      const start = new Date(schedule.startDate + 'T09:00:00');
      const dayBefore = new Date(start.getTime() - 24 * 60 * 60 * 1000);
      dayBefore.setHours(21, 0, 0, 0);
      const meta = (typeof CATEGORY_META !== 'undefined' && CATEGORY_META[schedule.category]) ||
                   { emoji: '💊', label: '' };
      const items = [];
      // 하루 전 알림은 미래일 때만 예약
      const now = new Date();
      if (dayBefore.getTime() > now.getTime()) {
        items.push({
          id: baseId,
          title: `내일 ${schedule.cycleNumber}차 시작`,
          body: `${meta.emoji} ${schedule.regimen} · 입원/투여 ${schedule.infusionDays}일`,
          schedule: { at: dayBefore, allowWhileIdle: true },
          smallIcon: 'ic_launcher',
          extra: { scheduleId: schedule.id, kind: 'day-before' },
        });
      }
      if (start.getTime() > now.getTime()) {
        items.push({
          id: baseId + 1,
          title: `오늘 ${schedule.cycleNumber}차 시작`,
          body: `${meta.emoji} ${schedule.regimen} · 화이팅 🎗️`,
          schedule: { at: start, allowWhileIdle: true },
          smallIcon: 'ic_launcher',
          extra: { scheduleId: schedule.id, kind: 'start' },
        });
      }
      if (items.length === 0) return { ok: false, reason: 'past' };
      try {
        await LocalNotifications.schedule({ notifications: items });
        return { ok: true, count: items.length };
      } catch (e) {
        console.warn('schedule failed', e);
        return { ok: false, reason: 'error' };
      }
    }

    async function cancelCycleReminder(scheduleId) {
      if (!isNativeApp || !LocalNotifications) return;
      const baseId = reminderIdForSchedule(scheduleId);
      try {
        await LocalNotifications.cancel({
          notifications: [{ id: baseId }, { id: baseId + 1 }],
        });
      } catch (e) {
        console.warn('cancel failed', e);
      }
    }

    // ========== 약 복용 알림 ==========
    // weekday: 0=일 ~ 6=토 (JavaScript getDay() 컨벤션).
    // Capacitor의 weekday는 1(일)~7(토)이므로 +1 변환.
    const MED_REMINDER_KEY = 'igt_medreminders';

    function medReminderIdFor(reminderId, weekday /* 0-6 or null=daily */) {
      let h = 0;
      const str = `med-${reminderId}-${weekday === null || weekday === undefined ? 'd' : weekday}`;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
      return Math.abs(h) % 2_000_000_000;
    }

    async function scheduleMedReminder(r) {
      if (!isNativeApp || !LocalNotifications) return { ok: false, reason: 'not-native' };
      if (!r || r.enabled === false) return { ok: false, reason: 'disabled' };
      const granted = await ensureNotificationPermission();
      if (!granted) return { ok: false, reason: 'permission-denied' };

      const [hStr, mStr] = String(r.time || '09:00').split(':');
      const hour = Math.max(0, Math.min(23, Number(hStr) || 0));
      const minute = Math.max(0, Math.min(59, Number(mStr) || 0));

      const weekdays = Array.isArray(r.weekdays) && r.weekdays.length > 0
        ? r.weekdays
        : [0, 1, 2, 3, 4, 5, 6];
      const isDaily = weekdays.length === 7;

      const items = [];
      const title = `💊 ${r.name || '약 복용 시간'}`;
      const body = '오늘도 잊지 말고 복용해주세요.';

      if (isDaily) {
        items.push({
          id: medReminderIdFor(r.id, null),
          title,
          body,
          schedule: { on: { hour, minute }, every: 'day', allowWhileIdle: true },
          smallIcon: 'ic_launcher',
          extra: { medReminderId: r.id, kind: 'med' },
        });
      } else {
        weekdays.forEach((dow) => {
          items.push({
            id: medReminderIdFor(r.id, dow),
            title,
            body,
            schedule: {
              on: { weekday: dow + 1, hour, minute }, // Capacitor: 1=Sun ~ 7=Sat
              every: 'week',
              allowWhileIdle: true,
            },
            smallIcon: 'ic_launcher',
            extra: { medReminderId: r.id, kind: 'med', weekday: dow },
          });
        });
      }

      try {
        // 같은 ID는 자동으로 덮어쓰기되지만, 다른 요일 조합으로 변경된 경우를 위해 먼저 cancel.
        await cancelMedReminder(r.id);
        await LocalNotifications.schedule({ notifications: items });
        return { ok: true, count: items.length };
      } catch (e) {
        console.warn('med schedule failed', e);
        return { ok: false, reason: 'error' };
      }
    }

    async function cancelMedReminder(reminderId) {
      if (!isNativeApp || !LocalNotifications) return;
      const ids = [medReminderIdFor(reminderId, null)];
      for (let i = 0; i < 7; i++) ids.push(medReminderIdFor(reminderId, i));
      try {
        await LocalNotifications.cancel({
          notifications: ids.map((id) => ({ id })),
        });
      } catch (e) {
        console.warn('med cancel failed', e);
      }
    }

    function weekdaysLabel(arr) {
      if (!arr || arr.length === 0) return '꺼짐';
      if (arr.length === 7) return '매일';
      if (arr.length === 5 && [1, 2, 3, 4, 5].every((d) => arr.includes(d))) return '평일';
      if (arr.length === 2 && arr.includes(0) && arr.includes(6)) return '주말';
      const KOR = ['일', '월', '화', '수', '목', '금', '토'];
      return [...arr].sort((a, b) => a - b).map((d) => KOR[d]).join('·');
    }

    function MedReminderCard() {
      const [reminders, setReminders] = useState(() => loadData(MED_REMINDER_KEY, []));
      const [showForm, setShowForm] = useState(false);
      const [name, setName] = useState('');
      const [time, setTime] = useState('09:00');
      const [weekdays, setWeekdays] = useState([0, 1, 2, 3, 4, 5, 6]);
      const [msg, setMsg] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      useEffect(() => {
        saveData(MED_REMINDER_KEY, reminders);
      }, [reminders]);

      function showMsg(t, ms = 4000) {
        setMsg(t);
        setTimeout(() => setMsg(''), ms);
      }

      function toggleWeekday(d) {
        setWeekdays((prev) =>
          prev.includes(d) ? prev.filter((x) => x !== d) : [...prev, d].sort((a, b) => a - b)
        );
      }

      function resetForm() {
        setName('');
        setTime('09:00');
        setWeekdays([0, 1, 2, 3, 4, 5, 6]);
        setShowForm(false);
      }

      async function handleAdd() {
        const trimmed = name.trim();
        if (!trimmed) return;
        if (weekdays.length === 0) {
          showMsg('요일을 하나 이상 선택해주세요.');
          return;
        }
        const r = {
          id: generateId(),
          name: trimmed,
          time,
          weekdays: [...weekdays].sort((a, b) => a - b),
          enabled: true,
          createdAt: new Date().toISOString(),
        };
        setReminders((prev) => [r, ...prev]);
        resetForm();

        const res = await scheduleMedReminder(r);
        if (res.ok) showMsg(`🔔 ${trimmed} 알림 ${res.count}건 예약됨`);
        else if (res.reason === 'permission-denied') showMsg('알림 권한이 거부됐어요. 시스템 설정에서 허용해주세요.');
        else if (res.reason === 'not-native') showMsg('알림은 설치된 앱에서만 동작해요. 지금은 등록만 저장됐어요.');
      }

      async function handleToggle(r) {
        const next = !r.enabled;
        const updated = { ...r, enabled: next };
        setReminders((prev) => prev.map((x) => (x.id === r.id ? updated : x)));
        if (next) {
          const res = await scheduleMedReminder(updated);
          if (res.ok) showMsg(`🔔 ${r.name} 알림 켜짐 (${res.count}건)`);
          else if (res.reason === 'permission-denied') showMsg('권한이 거부됐어요.');
        } else {
          await cancelMedReminder(r.id);
          showMsg(`🔕 ${r.name} 알림 꺼짐`);
        }
      }

      async function handleDelete() {
        const id = confirmDeleteId;
        await cancelMedReminder(id);
        setReminders((prev) => prev.filter((x) => x.id !== id));
        setConfirmDeleteId(null);
      }

      const KOR_DAYS = ['일', '월', '화', '수', '목', '금', '토'];

      return (
        <Card title="💊 약 복용 알림">
          <div className="text-xs text-textsub leading-relaxed mb-3">
            {isNativeApp
              ? '정해진 시간마다 약 복용을 알려드려요. 원하는 알림만 켜고 끄세요.'
              : '⚠️ 알림은 설치된 앱(iOS/Android)에서만 울려요. 지금은 등록만 가능합니다.'}
          </div>

          {reminders.length === 0 ? (
            <div className="py-3 text-center text-sm text-textsub">
              아직 등록된 알림이 없어요.
            </div>
          ) : (
            <ul className="space-y-2 mb-3">
              {reminders.map((r) => (
                <li
                  key={r.id}
                  className="rounded-xl border border-primary/15 p-3 flex items-center gap-2"
                >
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-textmain truncate">
                      {r.name}
                    </div>
                    <div className="text-xs text-textsub mt-0.5">
                      {r.time} · {weekdaysLabel(r.weekdays)}
                    </div>
                  </div>
                  <button
                    onClick={() => handleToggle(r)}
                    aria-label="알림 토글"
                    className={`relative inline-flex shrink-0 rounded-full transition-colors no-select
                                ${r.enabled ? 'bg-primary' : 'bg-gray-300'}`}
                    style={{ width: 44, height: 26, minHeight: 26 }}
                  >
                    <span
                      className="bg-white rounded-full shadow"
                      style={{
                        width: 20,
                        height: 20,
                        margin: 3,
                        transform: r.enabled ? 'translateX(18px)' : 'translateX(0)',
                        transition: 'transform 0.15s',
                      }}
                    />
                  </button>
                  <button
                    onClick={() => setConfirmDeleteId(r.id)}
                    aria-label="삭제"
                    className="text-base no-select active:opacity-70 flex items-center justify-center rounded-full"
                    style={{ minHeight: 36, minWidth: 36 }}
                  >
                    🗑️
                  </button>
                </li>
              ))}
            </ul>
          )}

          {showForm ? (
            <div className="space-y-3 rounded-xl border border-primary/20 p-3 bg-softbg">
              <div>
                <label className="block text-xs text-textsub mb-1">약 이름</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="예) 타이레놀, 항암제 (경구)"
                  className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain placeholder:text-textsub/70"
                />
              </div>

              <div>
                <label className="block text-xs text-textsub mb-1">알림 시간</label>
                <input
                  type="time"
                  value={time}
                  onChange={(e) => setTime(e.target.value)}
                  className="w-full rounded-xl border border-primary/20 bg-white px-3 py-3 text-textmain"
                />
              </div>

              <div>
                <label className="block text-xs text-textsub mb-1">반복 요일</label>
                <div className="flex gap-2 mb-2 flex-wrap">
                  <button
                    onClick={() => setWeekdays([0, 1, 2, 3, 4, 5, 6])}
                    className="rounded-full px-3 py-1.5 text-xs no-select bg-white border border-primary/20 text-textmain active:bg-primary/5"
                  >
                    매일
                  </button>
                  <button
                    onClick={() => setWeekdays([1, 2, 3, 4, 5])}
                    className="rounded-full px-3 py-1.5 text-xs no-select bg-white border border-primary/20 text-textmain active:bg-primary/5"
                  >
                    평일
                  </button>
                  <button
                    onClick={() => setWeekdays([0, 6])}
                    className="rounded-full px-3 py-1.5 text-xs no-select bg-white border border-primary/20 text-textmain active:bg-primary/5"
                  >
                    주말
                  </button>
                </div>
                <div className="flex gap-1">
                  {KOR_DAYS.map((d, i) => {
                    const active = weekdays.includes(i);
                    const accent = i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : '';
                    return (
                      <button
                        key={i}
                        onClick={() => toggleWeekday(i)}
                        className={`flex-1 rounded-lg py-2 text-xs font-semibold no-select
                                    ${active
                                      ? 'bg-primary text-white'
                                      : `bg-white border border-primary/20 ${accent || 'text-textsub'}`}`}
                        style={{ minHeight: 36 }}
                      >
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-1">
                <GhostButton onClick={resetForm}>취소</GhostButton>
                <PrimaryButton
                  onClick={handleAdd}
                  disabled={!name.trim() || weekdays.length === 0}
                >
                  알림 추가
                </PrimaryButton>
              </div>
            </div>
          ) : (
            <div className="flex justify-end">
              <GhostButton onClick={() => setShowForm(true)}>+ 약 복용 알림 추가</GhostButton>
            </div>
          )}

          {msg && (
            <div className="mt-3 text-xs text-textmain bg-primary/5 border border-primary/15 rounded-lg px-3 py-2 leading-relaxed">
              {msg}
            </div>
          )}

          <ConfirmDialog
            open={!!confirmDeleteId}
            title="알림을 삭제할까요?"
            message="삭제하면 예약된 알림도 함께 취소돼요."
            onConfirm={handleDelete}
            onCancel={() => setConfirmDeleteId(null)}
          />
        </Card>
      );
    }

    // ========== 백업 / 복원 ==========
    // localStorage 12개 키 + 부가 설정을 JSON 한 묶음으로 export/import.
    const BACKUP_KEYS = [
      'igt_cheering', 'igt_mood', 'igt_treatment', 'igt_sideeffects',
      'igt_medications', 'igt_vitals', 'igt_meals', 'igt_diary',
      'igt_expenses', 'igt_insurance', 'igt_profile', 'igt_schedule',
      'igt_notify_cycle', 'igt_medreminders', 'igt_dailyrecord',
    ];

    function buildBackupPayload() {
      const data = {};
      BACKUP_KEYS.forEach((k) => {
        try {
          const raw = localStorage.getItem(k);
          data[k] = raw === null ? null : JSON.parse(raw);
        } catch {
          data[k] = null;
        }
      });
      return {
        app: 'igeonaeja-oneuldo',
        version: 1,
        exportedAt: new Date().toISOString(),
        data,
      };
    }

    function applyBackupPayload(payload) {
      if (!payload || typeof payload !== 'object' || !payload.data) {
        throw new Error('형식이 올바르지 않은 백업 파일이에요.');
      }
      let restored = 0;
      BACKUP_KEYS.forEach((k) => {
        if (k in payload.data) {
          const v = payload.data[k];
          if (v === null || v === undefined) {
            localStorage.removeItem(k);
          } else {
            localStorage.setItem(k, JSON.stringify(v));
          }
          restored += 1;
        }
      });
      return restored;
    }

    function backupFilename() {
      const d = new Date();
      const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
      return `igt_backup_${stamp}.json`;
    }

    // 네이티브: Filesystem에 쓴 뒤 Share, 브라우저: <a download> 다운로드
    async function exportBackup() {
      const payload = buildBackupPayload();
      const json = JSON.stringify(payload, null, 2);
      const filename = backupFilename();

      if (isNativeApp && Filesystem && Share) {
        const writeRes = await Filesystem.writeFile({
          path: filename,
          data: json,
          directory: 'CACHE',
          encoding: 'utf8',
        });
        const fileUrl = writeRes.uri;
        try {
          await Share.share({
            title: '이겨내자 오늘도 백업',
            text: '항암 다이어리 백업 파일을 공유합니다.',
            url: fileUrl,
            dialogTitle: '백업 공유',
          });
          return { ok: true, mode: 'share', filename };
        } catch (e) {
          // 사용자가 공유창을 닫아도 파일은 캐시에 남아있음
          return { ok: true, mode: 'cached', filename, uri: fileUrl };
        }
      }

      // 브라우저 fallback
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return { ok: true, mode: 'download', filename };
    }

    function importBackupFromText(text) {
      const payload = JSON.parse(text);
      if (payload.app && payload.app !== 'igeonaeja-oneuldo') {
        throw new Error('다른 앱에서 만든 백업 파일이에요.');
      }
      return applyBackupPayload(payload);
    }

    // 복원 직후 / 필요 시 호출. localStorage에서 직접 읽어 enabled=true 항목을 모두 재예약.
    // scheduleXXX 헬퍼들이 cancel-then-schedule 이라 idempotent (중복 알림 안 생김).
    async function rescheduleAllReminders() {
      if (!isNativeApp || !LocalNotifications) return { ok: false, reason: 'not-native' };
      const granted = await ensureNotificationPermission();
      if (!granted) return { ok: false, reason: 'permission-denied' };

      let medCount = 0;
      let cycleCount = 0;

      // 약 복용 알림
      const meds = loadData(MED_REMINDER_KEY, []);
      for (const r of meds) {
        if (r && r.enabled) {
          const res = await scheduleMedReminder(r);
          if (res.ok) medCount += res.count;
        }
      }

      // 사이클 알림 (사용자가 토글 켜뒀을 때만)
      const cycleEnabled = loadData('igt_notify_cycle', false);
      if (cycleEnabled) {
        const schedules = loadData(SCHEDULE_STORAGE_KEY, []);
        for (const s of schedules) {
          const res = await scheduleCycleReminder(s);
          if (res.ok) cycleCount += res.count;
        }
      }

      return { ok: true, medCount, cycleCount };
    }

    function BackupCard() {
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [confirmReload, setConfirmReload] = useState(false);
      const fileInputRef = useRef(null);

      function showMsg(text, ms = 4000) {
        setMsg(text);
        setTimeout(() => setMsg(''), ms);
      }

      async function handleExport() {
        setBusy(true);
        try {
          const r = await exportBackup();
          if (r.mode === 'share') showMsg(`📤 ${r.filename} 공유 시트에서 카톡/메일/AirDrop으로 보내세요.`);
          else if (r.mode === 'download') showMsg(`💾 ${r.filename} 다운로드 시작`);
          else showMsg(`💾 ${r.filename} 임시 폴더에 저장됨`);
        } catch (e) {
          showMsg(`❌ 백업 실패: ${e.message || e}`);
        } finally {
          setBusy(false);
        }
      }

      async function handleImportFile(file) {
        if (!file) return;
        setBusy(true);
        try {
          const text = await file.text();
          const restored = importBackupFromText(text);
          let extra = '';
          if (isNativeApp) {
            try {
              const r = await rescheduleAllReminders();
              if (r.ok) {
                const total = (r.medCount || 0) + (r.cycleCount || 0);
                if (total > 0) extra = ` · 알림 ${total}건 자동 재예약`;
              } else if (r.reason === 'permission-denied') {
                extra = ' (알림 권한 거부 → 재예약 안 됨)';
              }
            } catch (e) {
              console.warn('reschedule after import failed', e);
            }
          }
          showMsg(`✅ ${restored}개 항목 복원${extra}. 잠시 후 새로고침합니다.`);
          setConfirmReload(true);
        } catch (e) {
          showMsg(`❌ 복원 실패: ${e.message || e}`);
        } finally {
          setBusy(false);
        }
      }

      return (
        <Card title="💾 백업 / 복원">
          <div className="text-xs text-textsub leading-relaxed mb-3">
            모든 기록을 JSON 한 파일로 저장해 카톡·메일·다른 기기로 옮길 수 있어요.
            앱 삭제 전 꼭 백업해두세요.
          </div>

          <div className="flex gap-2 flex-wrap">
            <PrimaryButton onClick={handleExport} disabled={busy}>
              {isNativeApp ? '📤 백업 공유' : '💾 백업 다운로드'}
            </PrimaryButton>
            <GhostButton onClick={() => fileInputRef.current?.click()}>
              📥 백업 복원
            </GhostButton>
            <input
              ref={fileInputRef}
              type="file"
              accept="application/json,.json"
              className="hidden"
              onChange={(e) => {
                const file = e.target.files?.[0];
                handleImportFile(file);
                e.target.value = '';
              }}
            />
          </div>

          {msg && (
            <div className="mt-3 text-xs text-textmain bg-primary/5 border border-primary/15 rounded-lg px-3 py-2 leading-relaxed">
              {msg}
            </div>
          )}

          <ConfirmDialog
            open={confirmReload}
            title="복원 완료. 화면을 새로고침할까요?"
            message="새로고침해야 변경된 데이터가 모두 반영돼요."
            onConfirm={() => {
              setConfirmReload(false);
              location.reload();
            }}
            onCancel={() => setConfirmReload(false)}
          />
        </Card>
      );
    }

    // ========== 탭 2: 치료 관리 (스케줄 입력) ==========
    // 신규 키. 기존 STORAGE_KEYS(11개)는 그대로 유지하기 위해 별도 상수로 분리.
    const SCHEDULE_STORAGE_KEY = 'igt_schedule';

    const CATEGORY_META = {
      colorectal:  { emoji: '🎗️', label: '대장암' },
      breast:      { emoji: '🎀', label: '유방암' },
      lung:        { emoji: '🫁', label: '폐암' },
      gastric:     { emoji: '🍚', label: '위암' },
      pancreatic:  { emoji: '🟡', label: '췌장암/담도암' },
      hematologic: { emoji: '🩸', label: '혈액암' },
      gyne:        { emoji: '🌸', label: '난소암/자궁암' },
      immune:      { emoji: '🛡️', label: '면역항암제' },
      custom:      { emoji: '✏️', label: '직접 입력' },
    };

    const SCHEDULE_DISCLAIMER =
      '※ 본 정보는 기록 보조용이며 의학적 판단을 대체하지 않습니다. 실제 투여 일정은 담당 의료진의 지시를 따르세요.';

    function RegimenScheduleModal({ open, onClose, onSave }) {
      const [step, setStep] = useState(1);
      const [categoryKey, setCategoryKey] = useState(null);
      const [regimen, setRegimen] = useState(null);

      // 일정 입력 폼
      const [startDate, setStartDate] = useState(todayKey());
      const [infusionDays, setInfusionDays] = useState(1);
      const [cycleDays, setCycleDays] = useState(14);
      const [cycleNumber, setCycleNumber] = useState(1);
      const [memo, setMemo] = useState('');

      // 모달 열릴 때마다 상태 초기화
      useEffect(() => {
        if (open) {
          setStep(1);
          setCategoryKey(null);
          setRegimen(null);
          setStartDate(todayKey());
          setInfusionDays(1);
          setCycleDays(14);
          setCycleNumber(1);
          setMemo('');
        }
      }, [open]);

      if (!open) return null;

      const categoryInfo = categoryKey ? REGIMEN_PRESETS[categoryKey] : null;

      function selectCategory(key) {
        setCategoryKey(key);
        setStep(2);
      }
      function selectRegimen(r) {
        setRegimen(r);
        setInfusionDays(Number(r.infusionDays) || 1);
        setCycleDays(Number(r.cycleDays) || 14);
        setStep(3);
      }
      function goBack() {
        if (step === 3) setStep(2);
        else if (step === 2) {
          setStep(1);
          setCategoryKey(null);
          setRegimen(null);
        }
      }
      function handleSave() {
        if (!regimen || !categoryKey) return;
        const inf = Math.max(0, Math.min(7, Number(infusionDays) || 0));
        const cyc = Math.max(7, Math.min(42, Number(cycleDays) || 14));
        const num = Math.max(1, Number(cycleNumber) || 1);
        const entry = {
          id: generateId(),
          regimen: regimen.name,
          category: categoryKey,
          startDate,
          infusionDays: inf,
          cycleDays: cyc,
          cycleNumber: num,
          memo: memo.trim(),
        };
        onSave(entry);
      }

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40"
          style={{ touchAction: 'none' }}
          onClick={onClose}
        >
          <div
            className="bg-white w-full max-w-[480px] rounded-t-2xl sm:rounded-2xl flex flex-col"
            style={{ maxHeight: '90vh' }}
            onClick={(e) => e.stopPropagation()}
          >
            {/* 헤더 */}
            <div className="px-4 pt-4 pb-3 flex items-center justify-between border-b border-primary/10">
              <button
                onClick={step > 1 ? goBack : onClose}
                className="text-sm text-primary no-select px-2 py-1"
                style={{ minHeight: 36, minWidth: 56 }}
              >
                {step > 1 ? '← 이전' : '취소'}
              </button>
              <div className="text-sm font-bold text-textmain">
                항암 스케줄 추가 <span className="text-textsub font-normal">({step}/3)</span>
              </div>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="text-textsub no-select"
                style={{ minHeight: 36, minWidth: 36 }}
              >
                ✕
              </button>
            </div>

            {/* 본문 */}
            <div
              className="flex-1 overflow-y-auto scroll-area px-4 py-4"
              style={{ minHeight: 0 }}
            >
              {/* 1단계: 암종 선택 */}
              {step === 1 && (
                <>
                  <div className="text-sm text-textmain font-semibold mb-1">암종을 선택해주세요</div>
                  <div className="text-xs text-textsub mb-4">
                    선택한 암종의 일반적인 항암 레지멘이 나타나요.
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {Object.entries(REGIMEN_PRESETS).map(([key, cat]) => {
                      const meta = CATEGORY_META[key] || { emoji: '💊', label: cat.label };
                      return (
                        <button
                          key={key}
                          onClick={() => selectCategory(key)}
                          className="rounded-2xl bg-softbg border border-primary/15 p-3 text-left no-select active:bg-primary/5"
                          style={{ minHeight: 100 }}
                        >
                          <div className="text-3xl mb-1 leading-none">{meta.emoji}</div>
                          <div className="text-sm font-semibold text-textmain">
                            {cat.label}
                          </div>
                          <div className="text-[11px] text-textsub mt-0.5">
                            {cat.regimens.length}개 레지멘
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </>
              )}

              {/* 2단계: 레지멘 선택 */}
              {step === 2 && categoryInfo && (
                <>
                  <div className="text-sm text-textmain font-semibold mb-1">
                    {CATEGORY_META[categoryKey]?.emoji} {categoryInfo.label} 레지멘
                  </div>
                  <div className="text-xs text-textsub mb-4">사용하시는 레지멘을 골라주세요.</div>
                  <ul className="space-y-2">
                    {categoryInfo.regimens.map((r, i) => {
                      const isHospital = (Number(r.infusionDays) || 0) >= 2;
                      const isOral = r.type === 'oral';
                      const isCustom = r.type === 'custom';
                      const tag = isCustom
                        ? '직접 입력'
                        : isOral
                        ? '경구'
                        : isHospital
                        ? '입원형'
                        : '외래형';
                      return (
                        <li key={i}>
                          <div className="rounded-xl border border-primary/15 bg-white p-3 flex items-start gap-3">
                            <div className="flex-1 min-w-0">
                              <div className="font-semibold text-textmain text-[15px] break-words">
                                {r.name}
                              </div>
                              <div className="text-xs text-textsub mt-0.5">
                                {r.cycleDays}일 주기 · {r.infusionDays}일 투여 · ({tag})
                              </div>
                              {r.desc && (
                                <div className="text-xs text-textmain/80 mt-1 leading-relaxed">
                                  {r.desc}
                                </div>
                              )}
                            </div>
                            <button
                              onClick={() => selectRegimen(r)}
                              className="rounded-full bg-primary text-white text-sm font-semibold px-3 py-1.5 no-select active:opacity-80 shrink-0"
                              style={{ minHeight: 36 }}
                            >
                              선택
                            </button>
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                </>
              )}

              {/* 3단계: 일정 입력 */}
              {step === 3 && regimen && (
                <>
                  <div className="text-sm text-textmain font-semibold mb-3">
                    {regimen.name}{' '}
                    <span className="text-textsub font-normal">
                      · {CATEGORY_META[categoryKey]?.label}
                    </span>
                  </div>

                  <label className="block text-xs text-textsub mb-1">치료 시작일</label>
                  <input
                    type="date"
                    value={startDate}
                    onChange={(e) => setStartDate(e.target.value)}
                    className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain"
                  />

                  <label className="block text-xs text-textsub mb-1">입원/투여 일수 (1~7)</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    min={0}
                    max={7}
                    value={infusionDays}
                    onChange={(e) => setInfusionDays(e.target.value)}
                    className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain"
                  />

                  <label className="block text-xs text-textsub mb-1">사이클 주기 (7~42일)</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    min={7}
                    max={42}
                    value={cycleDays}
                    onChange={(e) => setCycleDays(e.target.value)}
                    className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain"
                  />

                  <label className="block text-xs text-textsub mb-1">차수 번호</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    min={1}
                    value={cycleNumber}
                    onChange={(e) => setCycleNumber(e.target.value)}
                    className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain"
                  />

                  <label className="block text-xs text-textsub mb-1">메모 (선택)</label>
                  <textarea
                    rows={2}
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    placeholder="예) ㅇㅇ병원 외래, 4박5일 입원"
                    className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-3 text-textmain placeholder:text-textsub/70 resize-none"
                  />

                  <div className="rounded-xl bg-yellow-50 border border-yellow-200 p-3 text-xs text-textmain leading-relaxed">
                    💡 시작일부터 <b>{infusionDays}일</b> 동안 진한 형광펜으로,
                    이후 다음 사이클까지 <b>{cycleDays}일</b> 동안 옅은 형광펜으로 표시됩니다.
                  </div>
                </>
              )}
            </div>

            {/* 푸터: 액션 + 면책 */}
            <div
              className="px-4 py-3 border-t border-primary/10 flex flex-col gap-3"
              style={{ paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom))' }}
            >
              {step === 3 && (
                <div className="flex justify-end">
                  <PrimaryButton onClick={handleSave}>저장</PrimaryButton>
                </div>
              )}
              <div className="text-[11px] text-textsub leading-relaxed">
                {SCHEDULE_DISCLAIMER}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== 사이클 캘린더 ==========
    // 등록된 스케줄에 따라 달력 칸의 배경/글자색을 분기.
    // - 투여일 (시작일 ~ +infusionDays-1): 진한 핑크
    // - 사이클 기간 (투여일 종료 ~ +cycleDays-1): 옅은 핑크
    // - 두 스케줄이 겹치면 '투여일'이 우선
    function ScheduleCalendar({ schedules, onDateClick, recordedDates }) {
      const now = new Date();
      const [view, setView] = useState({ y: now.getFullYear(), m: now.getMonth() });
      const today = todayKey();
      const recordedSet = recordedDates instanceof Set ? recordedDates : new Set(recordedDates || []);

      const cells = useMemo(() => {
        const firstOfMonth = new Date(view.y, view.m, 1);
        const startWeekday = firstOfMonth.getDay();
        const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
        const arr = [];
        for (let i = 0; i < startWeekday; i++) arr.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dateKey = `${view.y}-${String(view.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          arr.push({ day: d, dateKey });
        }
        while (arr.length % 7 !== 0) arr.push(null);
        return arr;
      }, [view]);

      function statusFor(dateKey) {
        if (!dateKey) return null;
        let status = null;
        const dCur = new Date(dateKey + 'T00:00:00');
        for (const s of schedules) {
          if (!s.startDate) continue;
          const inf = Math.max(0, Number(s.infusionDays) || 0);
          const cyc = Math.max(0, Number(s.cycleDays) || 0);
          if (cyc <= 0) continue;
          const dStart = new Date(s.startDate + 'T00:00:00');
          const diff = Math.round((dCur - dStart) / 86400000);
          if (diff < 0) continue;
          if (diff < inf) return 'infusion';     // 가장 강한 상태, 즉시 종료
          if (diff < cyc) status = 'rest';        // fallback
        }
        return status;
      }

      function shiftMonth(delta) {
        setView(({ y, m }) => {
          const total = y * 12 + m + delta;
          return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
        });
      }
      function goToday() {
        const d = new Date();
        setView({ y: d.getFullYear(), m: d.getMonth() });
      }

      const WEEKDAYS_KOR = ['일', '월', '화', '수', '목', '금', '토'];

      return (
        <Card title={`📅 ${view.y}년 ${view.m + 1}월 사이클`}>
          {/* 월 이동 */}
          <div className="flex items-center justify-between mb-3">
            <button
              onClick={() => shiftMonth(-1)}
              aria-label="이전 달"
              className="rounded-full bg-softbg text-textmain no-select px-3 py-1.5 text-sm active:opacity-70"
              style={{ minHeight: 36 }}
            >
              ← 이전
            </button>
            <button
              onClick={goToday}
              className="rounded-full text-primary text-sm font-semibold no-select px-3 py-1.5 active:opacity-70"
              style={{ minHeight: 36 }}
            >
              오늘
            </button>
            <button
              onClick={() => shiftMonth(1)}
              aria-label="다음 달"
              className="rounded-full bg-softbg text-textmain no-select px-3 py-1.5 text-sm active:opacity-70"
              style={{ minHeight: 36 }}
            >
              다음 →
            </button>
          </div>

          {/* 요일 헤더 */}
          <div className="grid grid-cols-7 gap-1 mb-1">
            {WEEKDAYS_KOR.map((w, i) => (
              <div
                key={w}
                className={`text-center text-[11px] font-semibold py-1
                  ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-textsub'}`}
              >
                {w}
              </div>
            ))}
          </div>

          {/* 날짜 그리드 */}
          <div className="grid grid-cols-7 gap-1">
            {cells.map((cell, i) => {
              if (!cell) {
                return <div key={`p-${i}`} aria-hidden="true" />;
              }
              const status = statusFor(cell.dateKey);
              const isToday = cell.dateKey === today;
              const hasRecord = recordedSet.has(cell.dateKey);
              const dow = i % 7;

              let bgClass = '';
              let textClass =
                dow === 0 ? 'text-red-500' :
                dow === 6 ? 'text-blue-500' :
                'text-textmain';
              let weight = 'font-medium';

              if (status === 'infusion') {
                bgClass = 'bg-primary';
                textClass = 'text-white';
                weight = 'font-bold';
              } else if (status === 'rest') {
                bgClass = 'bg-primary/15';
                textClass = 'text-primary';
                weight = 'font-semibold';
              }

              const dotColor = status === 'infusion' ? 'bg-white' : 'bg-primary';
              const cellInner = (
                <>
                  <span>{cell.day}</span>
                  {hasRecord && (
                    <span
                      className={`absolute bottom-1 left-1/2 -translate-x-1/2 rounded-full ${dotColor}`}
                      style={{ width: 4, height: 4 }}
                      aria-label="기록 있음"
                    />
                  )}
                </>
              );

              const baseClass = `relative aspect-square flex items-center justify-center rounded-lg text-sm
                                 ${bgClass} ${textClass} ${weight}
                                 ${isToday ? 'ring-2 ring-primary' : ''}`;

              if (onDateClick) {
                return (
                  <button
                    key={cell.dateKey}
                    onClick={() => onDateClick(cell.dateKey)}
                    aria-label={`${cell.dateKey} 기록 열기`}
                    className={`${baseClass} no-select active:opacity-70`}
                  >
                    {cellInner}
                  </button>
                );
              }

              return (
                <div key={cell.dateKey} className={baseClass}>
                  {cellInner}
                </div>
              );
            })}
          </div>

          {/* 범례 */}
          <div className="flex items-center gap-3 mt-3 flex-wrap text-[11px] text-textsub">
            <div className="flex items-center gap-1">
              <span className="inline-block w-3 h-3 rounded bg-primary" />
              <span>투여일</span>
            </div>
            <div className="flex items-center gap-1">
              <span className="inline-block w-3 h-3 rounded bg-primary/15" />
              <span>사이클 기간</span>
            </div>
            <div className="flex items-center gap-1">
              <span className="inline-block w-3 h-3 rounded ring-2 ring-primary" />
              <span>오늘</span>
            </div>
          </div>

          {schedules.length === 0 && (
            <div className="mt-3 text-center text-xs text-textsub">
              아래에서 스케줄을 추가하면 색이 표시돼요.
            </div>
          )}
        </Card>
      );
    }

    // ========== 치료 여정 (게이미피케이션 추이) ==========
    // 사이클 한 차수가 끝날 때마다 레벨업.
    // 완료 기준: 오늘 >= startDate + cycleDays (full cycle elapsed)
    function ProgressCard({ schedules }) {
      const today = todayKey();

      const stats = useMemo(() => {
        let completed = 0;
        let inProgress = 0;
        let future = 0;
        const now = new Date(today + 'T00:00:00');
        schedules.forEach((s) => {
          if (!s.startDate) return;
          const start = new Date(s.startDate + 'T00:00:00');
          const cyc = Math.max(0, Number(s.cycleDays) || 0);
          const end = new Date(start);
          end.setDate(end.getDate() + cyc);
          if (now >= end) completed += 1;
          else if (now >= start) inProgress += 1;
          else future += 1;
        });
        return { completed, inProgress, future, total: schedules.length };
      }, [schedules, today]);

      const level = stats.completed;
      const MILESTONE = 5;
      const inMilestone = level % MILESTONE;
      const milestonesDone = Math.floor(level / MILESTONE);
      const nextMilestoneLevel = (milestonesDone + 1) * MILESTONE;

      // 월별 누적 완료 사이클 차트 데이터
      const trendData = useMemo(() => {
        if (schedules.length === 0) return [];
        const sorted = [...schedules]
          .filter((s) => s.startDate)
          .sort((a, b) => a.startDate.localeCompare(b.startDate));
        if (sorted.length === 0) return [];

        const firstStart = new Date(sorted[0].startDate + 'T00:00:00');
        const todayDt = new Date();
        let y = firstStart.getFullYear();
        let m = firstStart.getMonth();
        const lastY = todayDt.getFullYear();
        const lastM = todayDt.getMonth();

        const months = [];
        while (y < lastY || (y === lastY && m <= lastM)) {
          months.push({
            key: `${y}-${String(m + 1).padStart(2, '0')}`,
            완료: 0,
          });
          m += 1;
          if (m > 11) {
            y += 1;
            m = 0;
          }
          if (months.length > 24) break; // 안전 가드
        }

        // 각 사이클의 완료 시점 = startDate + cycleDays
        sorted.forEach((s) => {
          const start = new Date(s.startDate + 'T00:00:00');
          const cyc = Math.max(0, Number(s.cycleDays) || 0);
          const end = new Date(start);
          end.setDate(end.getDate() + cyc);
          const endKey = `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}`;
          months.forEach((mo) => {
            if (mo.key >= endKey) mo.완료 += 1;
          });
        });

        return months.slice(-6); // 최근 6개월
      }, [schedules]);

      // 레지멘별 통계
      const byRegimen = useMemo(() => {
        const map = new Map();
        const now = new Date(today + 'T00:00:00');
        schedules.forEach((s) => {
          if (!s.startDate || !s.regimen) return;
          const key = `${s.regimen}|${s.category || ''}`;
          if (!map.has(key)) {
            map.set(key, {
              regimen: s.regimen,
              category: s.category,
              completed: 0,
              inProgress: 0,
              future: 0,
            });
          }
          const stat = map.get(key);
          const start = new Date(s.startDate + 'T00:00:00');
          const cyc = Math.max(0, Number(s.cycleDays) || 0);
          const end = new Date(start);
          end.setDate(end.getDate() + cyc);
          if (now >= end) stat.completed += 1;
          else if (now >= start) stat.inProgress += 1;
          else stat.future += 1;
        });
        return [...map.values()].sort((a, b) => b.completed - a.completed);
      }, [schedules, today]);

      if (schedules.length === 0) return null;

      return (
        <Card title="🎯 치료 여정">
          {/* 레벨 배지 */}
          <div className="flex flex-col items-center mb-4">
            <div
              className="rounded-full bg-gradient-to-br from-pink-400 via-fuchsia-500 to-purple-500 text-white shadow-lg flex flex-col items-center justify-center"
              style={{ width: 110, height: 110 }}
            >
              <div className="text-[10px] font-semibold tracking-widest opacity-90">LEVEL</div>
              <div className="text-4xl font-extrabold leading-none">{level}</div>
            </div>
            <div className="text-sm text-textmain font-semibold mt-3">
              {level === 0
                ? '곧 1차 시작이에요. 화이팅 🎗️'
                : `${level}차 사이클 완료! 잘하고 있어요 💪`}
            </div>
            {/* 상태 뱃지 */}
            <div className="flex gap-2 mt-2 flex-wrap justify-center">
              <span className="text-[11px] rounded-full bg-primary/10 text-primary px-2 py-0.5 font-semibold">
                완료 {stats.completed}
              </span>
              {stats.inProgress > 0 && (
                <span className="text-[11px] rounded-full bg-yellow-100 text-yellow-700 px-2 py-0.5 font-semibold">
                  진행 중 {stats.inProgress}
                </span>
              )}
              {stats.future > 0 && (
                <span className="text-[11px] rounded-full bg-secondary/10 text-secondary px-2 py-0.5 font-semibold">
                  예정 {stats.future}
                </span>
              )}
            </div>
          </div>

          {/* 다음 마일스톤 */}
          <div className="mb-4">
            <div className="flex justify-between text-xs text-textsub mb-1">
              <span>다음 마일스톤 (Lv {nextMilestoneLevel})</span>
              <span className="font-semibold text-primary">{inMilestone}/{MILESTONE}</span>
            </div>
            <div className="h-3 w-full rounded-full bg-softbg overflow-hidden">
              <div
                className="h-full rounded-full bg-gradient-to-r from-pink-500 to-purple-500 transition-all"
                style={{ width: `${(inMilestone / MILESTONE) * 100}%` }}
              />
            </div>
            {milestonesDone > 0 && (
              <div className="text-[11px] text-textsub mt-1 text-center">
                🏆 마일스톤 {milestonesDone}개 달성
              </div>
            )}
          </div>

          {/* 누적 추이 차트 */}
          {trendData.length >= 2 && (
            <div className="mb-4">
              <div className="text-xs text-textsub mb-2">
                누적 완료 사이클 (최근 {trendData.length}개월)
              </div>
              <ResponsiveContainer width="100%" height={180}>
                <LineChart data={trendData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0e4ee" />
                  <XAxis dataKey="key" tick={{ fontSize: 10, fill: '#6B7280' }} />
                  <YAxis
                    tick={{ fontSize: 11, fill: '#6B7280' }}
                    allowDecimals={false}
                    width={28}
                  />
                  <Tooltip formatter={(v) => `${v}차`} />
                  <Line
                    type="monotone"
                    dataKey="완료"
                    stroke="#E91E8C"
                    strokeWidth={2.5}
                    dot={{ r: 5, fill: '#E91E8C' }}
                    activeDot={{ r: 7 }}
                    isAnimationActive={false}
                  />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          {/* 레지멘별 */}
          {byRegimen.length > 0 && (
            <div>
              <div className="text-xs text-textsub mb-2">레지멘별 진행</div>
              <ul className="space-y-2">
                {byRegimen.map((r, i) => {
                  const meta = CATEGORY_META[r.category] || { emoji: '💊', label: '' };
                  return (
                    <li
                      key={i}
                      className="rounded-xl border border-primary/15 p-3 flex items-center gap-2"
                    >
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-semibold text-textmain truncate">
                          {meta.emoji} {r.regimen}
                        </div>
                        <div className="text-xs text-textsub mt-0.5">
                          {meta.label}
                          {r.inProgress > 0 ? ` · 진행 ${r.inProgress}` : ''}
                          {r.future > 0 ? ` · 예정 ${r.future}` : ''}
                        </div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="text-base font-extrabold text-primary leading-none">
                          Lv {r.completed}
                        </div>
                        <div className="text-[10px] text-textsub mt-0.5">완료</div>
                      </div>
                    </li>
                  );
                })}
              </ul>
            </div>
          )}
        </Card>
      );
    }

    // ========== 일일 기록 모달 (부작용 우선, 식사·약은 다음 단계) ==========
    const DAILYRECORD_STORAGE_KEY = 'igt_dailyrecord';

    // 0=없음, 1=경미, 2=중등도, 3=심함
    const SEVERITY_LABELS = ['없음', '경미', '중등도', '심함'];
    const SEVERITY_BTN_CLASSES = [
      'bg-softbg text-textsub border-primary/15',
      'bg-yellow-100 text-yellow-800 border-yellow-300',
      'bg-orange-100 text-orange-800 border-orange-300',
      'bg-red-100 text-red-700 border-red-300',
    ];

    // 11개 항암 부작용 항목 (사용자 요청 + 일반 케이스)
    const SIDE_EFFECT_ITEMS = [
      { key: 'pain',         emoji: '😖', label: '통증' },
      { key: 'nausea',       emoji: '😵', label: '오심·구역' },
      { key: 'vomit',        emoji: '🤮', label: '구토' },
      { key: 'diarrhea',     emoji: '💧', label: '설사' },
      { key: 'constipation', emoji: '🚫', label: '변비' },
      { key: 'fatigue',      emoji: '😴', label: '피로감' },
      { key: 'appetite',     emoji: '🍽️', label: '식욕저하' },
      { key: 'mouth',        emoji: '🦷', label: '구내염' },
      { key: 'handfoot',     emoji: '🖐️', label: '수족증후군' },
      { key: 'hairloss',     emoji: '💇', label: '탈모' },
      { key: 'numb',         emoji: '🤲', label: '손발 저림' },
    ];

    // 식사 4끼 + 수분
    const MEAL_KEYS = [
      { key: 'breakfast', label: '아침', emoji: '🌅' },
      { key: 'lunch',     label: '점심', emoji: '🌞' },
      { key: 'snack',     label: '간식', emoji: '🍎' },
      { key: 'dinner',    label: '저녁', emoji: '🌙' },
    ];
    const WATER_GOAL_ML = 2000;
    function ratioEmoji(r) {
      const v = Number(r) || 0;
      if (v === 0) return '😞';
      if (v <= 30) return '😕';
      if (v <= 50) return '😐';
      if (v <= 80) return '😊';
      return '🎉';
    }

    // 약 복용 4종 (간단 토글)
    const MED_QUICK_CATEGORIES = [
      { key: 'painkiller',   label: '진통제',  emoji: '💊', placeholder: '예) 타이레놀, 트라마돌' },
      { key: 'antiemetic',   label: '제토제',  emoji: '🤢', placeholder: '예) 조프란, 카이트릴' },
      { key: 'laxative',     label: '변비약',  emoji: '🌿', placeholder: '예) 마그밀, 락툴로스' },
      { key: 'antidiarrhea', label: '지사제',  emoji: '🛑', placeholder: '예) 스멕타, 로페라마이드' },
    ];

    // 통증은 NRS(0~10) 사용, 나머지는 0~3 segmented
    function painEmoji(v) {
      const n = Number(v) || 0;
      if (n === 0) return '😌';
      if (n <= 3) return '🙂';
      if (n <= 6) return '😣';
      if (n <= 9) return '😖';
      return '🥵';
    }
    function severityThreshold(key) {
      // "중등도 이상" 카운트용
      return key === 'pain' ? 4 : 2;
    }

    function emptyDailyRecord(date) {
      const sideEffects = {};
      SIDE_EFFECT_ITEMS.forEach((it) => { sideEffects[it.key] = 0; });
      const meals = { water: 0 };
      MEAL_KEYS.forEach((m) => { meals[m.key] = { content: '', ratio: 0 }; });
      const meds = {};
      MED_QUICK_CATEGORIES.forEach((c) => { meds[c.key] = { taken: false, name: '', count: 0 }; });
      return {
        date,
        fever: null,
        sideEffects,
        // 구토·설사는 0~3 정도와 함께 횟수·양상도 같이 기록
        vomitCount: 0,
        vomitChar: '',
        diarrheaCount: 0,
        diarrheaChar: '',
        meals,
        meds,
        other: '',
        memo: '',
        updatedAt: null,
      };
    }

    function loadDailyRecord(date) {
      const all = loadData(DAILYRECORD_STORAGE_KEY, []);
      const found = all.find((r) => r.date === date);
      if (!found) return emptyDailyRecord(date);
      // 과거 버전(식사·약 필드 없음) 호환
      const base = emptyDailyRecord(date);
      return {
        ...base,
        ...found,
        sideEffects: { ...base.sideEffects, ...(found.sideEffects || {}) },
        meals: {
          ...base.meals,
          ...(found.meals || {}),
          ...MEAL_KEYS.reduce((acc, m) => {
            const v = (found.meals || {})[m.key];
            acc[m.key] = v && typeof v === 'object'
              ? { content: v.content || '', ratio: Number(v.ratio) || 0 }
              : base.meals[m.key];
            return acc;
          }, {}),
        },
        meds: {
          ...base.meds,
          ...MED_QUICK_CATEGORIES.reduce((acc, c) => {
            const v = (found.meds || {})[c.key];
            acc[c.key] = v && typeof v === 'object'
              ? { taken: !!v.taken, name: v.name || '', count: Number(v.count) || 0 }
              : base.meds[c.key];
            return acc;
          }, {}),
        },
      };
    }

    function isRecordMeaningful(r) {
      if (!r) return false;
      if (r.fever !== null && r.fever !== '' && Number(r.fever) > 0) return true;
      if (r.other && r.other.trim()) return true;
      if (r.memo && r.memo.trim()) return true;
      const se = r.sideEffects || {};
      if (Object.values(se).some((v) => Number(v) > 0)) return true;
      if (Number(r.vomitCount) > 0 || (r.vomitChar && r.vomitChar.trim())) return true;
      if (Number(r.diarrheaCount) > 0 || (r.diarrheaChar && r.diarrheaChar.trim())) return true;
      const meals = r.meals || {};
      if (Number(meals.water) > 0) return true;
      for (const m of MEAL_KEYS) {
        const meal = meals[m.key];
        if (meal && (Number(meal.ratio) > 0 || (meal.content && meal.content.trim()))) return true;
      }
      const meds = r.meds || {};
      for (const c of MED_QUICK_CATEGORIES) {
        if (meds[c.key] && meds[c.key].taken) return true;
      }
      return false;
    }

    function saveDailyRecord(record) {
      const all = loadData(DAILYRECORD_STORAGE_KEY, []);
      const without = all.filter((r) => r.date !== record.date);
      if (!isRecordMeaningful(record)) {
        // 의미 있는 데이터가 없으면 그 날짜 자체를 제거
        saveData(DAILYRECORD_STORAGE_KEY, without);
        return false;
      }
      const next = { ...record, updatedAt: new Date().toISOString() };
      saveData(DAILYRECORD_STORAGE_KEY, [next, ...without]);
      return true;
    }

    function DailyRecordModal({ open, date, onClose, onSaved }) {
      const [record, setRecord] = useState(null);
      const [confirmDeleteOpen, setConfirmDeleteOpen] = useState(false);

      useEffect(() => {
        if (open && date) {
          setRecord(loadDailyRecord(date));
        }
      }, [open, date]);

      if (!open || !record) return null;

      function setSeverity(key, value) {
        setRecord((prev) => ({
          ...prev,
          sideEffects: { ...prev.sideEffects, [key]: value },
        }));
      }

      function handleSave() {
        const saved = saveDailyRecord(record);
        if (onSaved) onSaved(saved ? 'saved' : 'cleared');
        onClose();
      }

      function handleDelete() {
        const all = loadData(DAILYRECORD_STORAGE_KEY, []);
        saveData(DAILYRECORD_STORAGE_KEY, all.filter((r) => r.date !== date));
        if (onSaved) onSaved('cleared');
        setConfirmDeleteOpen(false);
        onClose();
      }

      const severeCount = SIDE_EFFECT_ITEMS.reduce((acc, it) => {
        const v = Number(record.sideEffects[it.key]) || 0;
        return v >= severityThreshold(it.key) ? acc + 1 : acc;
      }, 0);

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40"
          style={{ touchAction: 'none' }}
          onClick={onClose}
        >
          <div
            className="bg-white w-full max-w-[480px] rounded-t-2xl sm:rounded-2xl flex flex-col"
            style={{ maxHeight: '90vh' }}
            onClick={(e) => e.stopPropagation()}
          >
            {/* 헤더 */}
            <div className="px-4 pt-4 pb-3 flex items-center justify-between border-b border-primary/10">
              <button
                onClick={onClose}
                className="text-sm text-primary no-select px-2 py-1"
                style={{ minHeight: 36, minWidth: 56 }}
              >
                닫기
              </button>
              <div className="text-sm font-bold text-textmain">
                {formatKoreanDate(date)} 기록
              </div>
              <button
                onClick={onClose}
                aria-label="닫기"
                className="text-textsub no-select"
                style={{ minHeight: 36, minWidth: 36 }}
              >
                ✕
              </button>
            </div>

            {/* 본문 */}
            <div className="flex-1 overflow-y-auto scroll-area px-4 py-4 space-y-5" style={{ minHeight: 0 }}>
              {/* 체온 */}
              <section>
                <div className="text-sm font-bold text-textmain mb-2">🌡️ 체온</div>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    inputMode="decimal"
                    step="0.1"
                    min="34"
                    max="42"
                    value={record.fever ?? ''}
                    onChange={(e) => {
                      const v = e.target.value;
                      setRecord((prev) => ({ ...prev, fever: v === '' ? null : Number(v) }));
                    }}
                    placeholder="36.5"
                    className="flex-1 rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70 text-right"
                  />
                  <span className="text-sm text-textsub">°C</span>
                </div>
                {record.fever !== null && Number(record.fever) >= 38 && (
                  <div className="mt-2 text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
                    🔥 38°C 이상 발열입니다. 담당의에게 즉시 연락하세요.
                  </div>
                )}
              </section>

              {/* 부작용 11개 */}
              <section>
                <div className="text-sm font-bold text-textmain mb-2">
                  💢 부작용 정도
                  {severeCount > 0 && (
                    <span className="ml-2 text-xs text-red-600 font-semibold">
                      중등도 이상 {severeCount}건
                    </span>
                  )}
                </div>
                <div className="text-xs text-textsub mb-3">
                  통증은 NRS(0~10), 그 외는 없음/경미/중등도/심함 — 가장 가까운 단계를 선택하세요.
                </div>
                <ul className="space-y-2">
                  {SIDE_EFFECT_ITEMS.map((it) => {
                    const cur = Number(record.sideEffects[it.key]) || 0;

                    // === 통증: NRS 0~10 슬라이더 ===
                    if (it.key === 'pain') {
                      const painLabel =
                        cur === 0 ? '없음' :
                        cur <= 3 ? '약함' :
                        cur <= 6 ? '보통' :
                        cur <= 9 ? '심함' : '극심';
                      return (
                        <li key={it.key} className="rounded-xl border border-primary/10 p-3">
                          <div className="flex items-center justify-between mb-2">
                            <div className="text-sm font-semibold text-textmain">
                              {it.emoji} {it.label} <span className="text-textsub font-normal text-xs">(NRS 0~10)</span>
                            </div>
                            <div className="flex items-center gap-1">
                              <span className="text-base">{painEmoji(cur)}</span>
                              <span className={`text-sm font-bold ${cur >= 7 ? 'text-red-600' : cur >= 4 ? 'text-orange-600' : 'text-textmain'}`}>
                                {cur}
                              </span>
                              <span className="text-[11px] text-textsub ml-1">{painLabel}</span>
                            </div>
                          </div>
                          <input
                            type="range"
                            min={0}
                            max={10}
                            step={1}
                            value={cur}
                            onChange={(e) => setSeverity('pain', Number(e.target.value))}
                            className="w-full accent-primary"
                            style={{ height: 24 }}
                          />
                          <div className="flex justify-between text-[10px] text-textsub mt-1 px-1">
                            <span>0 없음</span>
                            <span>3 약함</span>
                            <span>6 보통</span>
                            <span>10 극심</span>
                          </div>
                        </li>
                      );
                    }

                    // === 일반 0~3 segmented ===
                    const hasDetail = it.key === 'vomit' || it.key === 'diarrhea';
                    const countKey = it.key === 'vomit' ? 'vomitCount' : 'diarrheaCount';
                    const charKey  = it.key === 'vomit' ? 'vomitChar'  : 'diarrheaChar';
                    const charPlaceholder = it.key === 'vomit'
                      ? '예) 음식물, 노란 물, 거품, 피'
                      : '예) 묽은 변, 물설사, 점액·혈변';

                    return (
                      <li key={it.key} className="rounded-xl border border-primary/10 p-3">
                        <div className="flex items-center justify-between mb-2">
                          <div className="text-sm font-semibold text-textmain">
                            {it.emoji} {it.label}
                          </div>
                          {cur > 0 && (
                            <span className="text-xs text-textsub">{SEVERITY_LABELS[cur]}</span>
                          )}
                        </div>
                        <div className="grid grid-cols-4 gap-1">
                          {SEVERITY_LABELS.map((label, lvl) => {
                            const active = cur === lvl;
                            const cls = active ? SEVERITY_BTN_CLASSES[lvl] : 'bg-white text-textsub border-primary/15';
                            return (
                              <button
                                key={lvl}
                                onClick={() => setSeverity(it.key, lvl)}
                                className={`rounded-lg border text-xs no-select py-2 ${cls} ${active ? 'font-bold' : ''}`}
                                style={{ minHeight: 36 }}
                              >
                                {label}
                              </button>
                            );
                          })}
                        </div>
                        {hasDetail && cur > 0 && (
                          <div className="grid grid-cols-3 gap-2 mt-3">
                            <div className="flex items-center gap-1">
                              <input
                                type="number"
                                inputMode="numeric"
                                min={0}
                                max={50}
                                value={Number(record[countKey]) || ''}
                                onChange={(e) => {
                                  const v = e.target.value;
                                  setRecord((prev) => ({ ...prev, [countKey]: v === '' ? 0 : Number(v) }));
                                }}
                                placeholder="0"
                                className="flex-1 min-w-0 rounded-lg border border-primary/15 bg-softbg px-2 py-2 text-sm text-textmain placeholder:text-textsub/70 text-center"
                              />
                              <span className="text-xs text-textsub shrink-0">회</span>
                            </div>
                            <input
                              type="text"
                              value={record[charKey] || ''}
                              onChange={(e) => setRecord((prev) => ({ ...prev, [charKey]: e.target.value }))}
                              placeholder={charPlaceholder}
                              className="col-span-2 rounded-lg border border-primary/15 bg-softbg px-3 py-2 text-sm text-textmain placeholder:text-textsub/70"
                            />
                          </div>
                        )}
                      </li>
                    );
                  })}
                </ul>
              </section>

              {/* 기타 부작용 */}
              <section>
                <div className="text-sm font-bold text-textmain mb-2">✏️ 기타 증상</div>
                <textarea
                  rows={2}
                  value={record.other}
                  onChange={(e) => setRecord((prev) => ({ ...prev, other: e.target.value }))}
                  placeholder="예) 어지러움, 두통 등 위에 없는 증상"
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70 resize-none"
                />
              </section>

              {/* 식사량 + 종류 */}
              <section>
                {(() => {
                  const eaten = MEAL_KEYS
                    .map((m) => Number((record.meals && record.meals[m.key] && record.meals[m.key].ratio) || 0))
                    .filter((v) => v > 0);
                  const avg = eaten.length > 0 ? Math.round(eaten.reduce((a, b) => a + b, 0) / eaten.length) : null;
                  return (
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-sm font-bold text-textmain">🍚 식사량</div>
                      {avg !== null && (
                        <span className="text-xs text-textsub">
                          평균 {avg}% {ratioEmoji(avg)}
                        </span>
                      )}
                    </div>
                  );
                })()}
                <ul className="space-y-3">
                  {MEAL_KEYS.map((m) => {
                    const meal = (record.meals && record.meals[m.key]) || { content: '', ratio: 0 };
                    return (
                      <li key={m.key} className="rounded-xl border border-primary/10 p-3">
                        <div className="flex items-center justify-between mb-2">
                          <div className="text-sm font-semibold text-textmain">
                            {m.emoji} {m.label}
                          </div>
                          <div className="text-xs text-textsub flex items-center gap-1">
                            <span className="text-base">{ratioEmoji(meal.ratio)}</span>
                            <span className="font-semibold text-textmain w-9 text-right">
                              {Number(meal.ratio) || 0}%
                            </span>
                          </div>
                        </div>
                        <input
                          type="text"
                          value={meal.content}
                          onChange={(e) =>
                            setRecord((prev) => ({
                              ...prev,
                              meals: {
                                ...prev.meals,
                                [m.key]: { ...prev.meals[m.key], content: e.target.value },
                              },
                            }))
                          }
                          placeholder="무엇을 드셨나요? (선택)"
                          className="w-full rounded-lg border border-primary/15 bg-softbg px-3 py-2 mb-2 text-sm text-textmain placeholder:text-textsub/70"
                        />
                        <input
                          type="range"
                          min={0}
                          max={100}
                          step={10}
                          value={Number(meal.ratio) || 0}
                          onChange={(e) =>
                            setRecord((prev) => ({
                              ...prev,
                              meals: {
                                ...prev.meals,
                                [m.key]: { ...prev.meals[m.key], ratio: Number(e.target.value) },
                              },
                            }))
                          }
                          className="w-full accent-primary"
                          style={{ height: 24 }}
                        />
                      </li>
                    );
                  })}
                </ul>
              </section>

              {/* 수분 섭취 */}
              <section>
                <div className="text-sm font-bold text-textmain mb-2">💧 수분 섭취</div>
                <div className="flex items-center gap-2 mb-2">
                  <input
                    type="number"
                    inputMode="numeric"
                    min={0}
                    max={5000}
                    step={50}
                    value={Number((record.meals && record.meals.water) || 0) || ''}
                    onChange={(e) => {
                      const v = e.target.value;
                      setRecord((prev) => ({
                        ...prev,
                        meals: { ...prev.meals, water: v === '' ? 0 : Number(v) },
                      }));
                    }}
                    placeholder="0"
                    className="flex-1 rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70 text-right"
                  />
                  <span className="text-sm text-textsub">ml</span>
                </div>
                {(() => {
                  const water = Number((record.meals && record.meals.water) || 0);
                  const pct = Math.min(100, Math.max(0, (water / WATER_GOAL_ML) * 100));
                  return (
                    <>
                      <div className="h-2.5 w-full rounded-full bg-softbg overflow-hidden">
                        <div
                          className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-all"
                          style={{ width: `${pct}%` }}
                        />
                      </div>
                      <div className="flex justify-between mt-1 text-[11px] text-textsub">
                        <span>{water}ml</span>
                        <span>목표 {WATER_GOAL_ML}ml ({pct.toFixed(0)}%)</span>
                      </div>
                    </>
                  );
                })()}
              </section>

              {/* 약 복용 (4종 빠른 체크) */}
              <section>
                <div className="text-sm font-bold text-textmain mb-2">💊 약 복용</div>
                <div className="text-xs text-textsub mb-3">
                  복용한 약을 켜고, 필요시 이름·횟수를 적어주세요.
                </div>
                <ul className="space-y-2">
                  {MED_QUICK_CATEGORIES.map((c) => {
                    const m = (record.meds && record.meds[c.key]) || { taken: false, name: '', count: 0 };
                    return (
                      <li
                        key={c.key}
                        className={`rounded-xl border p-3 transition-colors
                                    ${m.taken ? 'border-primary/40 bg-primary/5' : 'border-primary/10 bg-white'}`}
                      >
                        <div className="flex items-center gap-3">
                          <button
                            onClick={() =>
                              setRecord((prev) => ({
                                ...prev,
                                meds: {
                                  ...prev.meds,
                                  [c.key]: { ...prev.meds[c.key], taken: !prev.meds[c.key].taken },
                                },
                              }))
                            }
                            aria-label={`${c.label} 복용 여부`}
                            className={`relative inline-flex shrink-0 rounded-full transition-colors no-select
                                        ${m.taken ? 'bg-primary' : 'bg-gray-300'}`}
                            style={{ width: 44, height: 26, minHeight: 26 }}
                          >
                            <span
                              className="bg-white rounded-full shadow"
                              style={{
                                width: 20,
                                height: 20,
                                margin: 3,
                                transform: m.taken ? 'translateX(18px)' : 'translateX(0)',
                                transition: 'transform 0.15s',
                              }}
                            />
                          </button>
                          <div className="flex-1">
                            <div className="text-sm font-semibold text-textmain">
                              {c.emoji} {c.label}
                            </div>
                          </div>
                        </div>
                        {m.taken && (
                          <div className="mt-3 grid grid-cols-3 gap-2">
                            <input
                              type="text"
                              value={m.name}
                              onChange={(e) =>
                                setRecord((prev) => ({
                                  ...prev,
                                  meds: {
                                    ...prev.meds,
                                    [c.key]: { ...prev.meds[c.key], name: e.target.value },
                                  },
                                }))
                              }
                              placeholder={c.placeholder}
                              className="col-span-2 rounded-lg border border-primary/15 bg-white px-3 py-2 text-sm text-textmain placeholder:text-textsub/70"
                            />
                            <div className="flex items-center gap-1">
                              <input
                                type="number"
                                inputMode="numeric"
                                min={0}
                                max={20}
                                value={Number(m.count) || ''}
                                onChange={(e) => {
                                  const v = e.target.value;
                                  setRecord((prev) => ({
                                    ...prev,
                                    meds: {
                                      ...prev.meds,
                                      [c.key]: { ...prev.meds[c.key], count: v === '' ? 0 : Number(v) },
                                    },
                                  }));
                                }}
                                placeholder="0"
                                className="flex-1 min-w-0 rounded-lg border border-primary/15 bg-white px-2 py-2 text-sm text-textmain placeholder:text-textsub/70 text-center"
                              />
                              <span className="text-xs text-textsub">회</span>
                            </div>
                          </div>
                        )}
                      </li>
                    );
                  })}
                </ul>

                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70 resize-none"

              <div className="text-[11px] text-textsub leading-relaxed pt-2">

              </div>
            </div>

            {/* 푸터 */}
            <div

                <button
                  onClick={() => setConfirmDeleteOpen(true)}
                  className="text-xs text-red-500 no-select px-2 py-1"
                  style={{ minHeight: 36 }}
                >
                  🗑️ 이 날짜 기록 삭제

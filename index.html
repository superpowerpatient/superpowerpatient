<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="이겨내자 오늘도" />
  <meta name="theme-color" content="#E91E8C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />

  <title>이겨내자 오늘도 🎗️</title>

  <!-- PWA: 매니페스트 + 아이콘 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />

  <!-- CDN 로딩 순서: React → ReactDOM → prop-types → Recharts → Babel → Tailwind -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // Tailwind 커스텀 테마
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E91E8C',
            secondary: '#6C63FF',
            softbg: '#FFF8FC',
            textmain: '#2D1B3D',
            textsub: '#6B7280',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo',
                   'Noto Sans KR', 'Pretendard', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            card: '0 4px 20px rgba(233, 30, 140, 0.08)',
          },
        },
      },
    };
  </script>

  <style>
    /* iOS Safari: 탭 파란 하이라이트 제거 */
    * { -webkit-tap-highlight-color: transparent; }

    /* 바운스 스크롤/가로 스크롤 차단 */
    html, body {
      overscroll-behavior-y: contain;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background-color: #FFF8FC;
      color: #2D1B3D;
    }

    /* iOS 자동 확대 방지: input/textarea/select는 최소 16px */
    input, textarea, select { font-size: 16px !important; }

    /* 터치 지연(300ms) 제거 */
    button, a, [role="button"] { touch-action: manipulation; }

    /* 노치/홈 인디케이터 대응 */
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    /* 하단 탭바: 홈 인디케이터 위에 뜨도록 */
    .tab-bar {
      padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
    }

    /* 내부 스크롤 영역 iOS 관성 */
    .scroll-area {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* 버튼/탭 텍스트 선택 방지 */
    .no-select {
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus, input:focus, textarea:focus, select:focus { outline: none; }

    /* 선택된 기분 버튼 살짝 확대 */
    .mood-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .mood-btn.selected { transform: scale(1.1); }

    /* 형광펜 느낌 화이팅 카드 */
    .highlighter {
      background: linear-gradient(180deg, transparent 55%, #FFF59D 55%);
    }
  </style>
</head>

<body class="bg-softbg font-sans">
  <div id="root">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#E91E8C;font-family:-apple-system,sans-serif;">
      이겨내자 오늘도 🎗️ 로딩 중…
    </div>
  </div>

  <!-- PWA: Service Worker 등록 (file:// 에서는 자동 스킵) -->
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('SW 등록 실패:', err);
        });
      });
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    const {
      LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
      ReferenceLine,
    } = Recharts;

    // ========== localStorage 키 ==========
    const STORAGE_KEYS = {
      cheering:    'igt_cheering',
      mood:        'igt_mood',
      treatment:   'igt_treatment',
      sideEffects: 'igt_sideeffects',
      medications: 'igt_medications',
      vitals:      'igt_vitals',
      meals:       'igt_meals',
      diary:       'igt_diary',
      expenses:    'igt_expenses',
      insurance:   'igt_insurance',
      profile:     'igt_profile',
    };

    // ========== 공통 유틸 ==========
    function loadData(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        console.warn('loadData 실패:', key, e);
        return fallback;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn('saveData 실패:', key, e);
      }
    }

    function generateId() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    // 로컬 타임존 기준 YYYY-MM-DD
    function todayKey(d) {
      const dt = d ? new Date(d) : new Date();
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    function formatKoreanDate(dateStr) {
      const dt = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      return `${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 (${WEEKDAYS[dt.getDay()]})`;
    }

    // ========== 기분 이모지 ==========
    const MOODS = [
      { value: 'great', emoji: '😄', label: '아주 좋음' },
      { value: 'good',  emoji: '😊', label: '좋음' },
      { value: 'soso',  emoji: '😐', label: '그저 그럼' },
      { value: 'down',  emoji: '😔', label: '힘듦' },
      { value: 'bad',   emoji: '😢', label: '매우 힘듦' },
    ];

    // ========== 탭 정의 ==========
    const TABS = [
      { key: 'home',      icon: '📋', label: '오늘' },
      { key: 'treatment', icon: '💊', label: '치료' },
      { key: 'body',      icon: '🏥', label: '몸상태' },
      { key: 'diary',     icon: '📖', label: '일기' },
      { key: 'expense',   icon: '💰', label: '병원비' },
    ];

    // ========== 항암 레지멘 프리셋 ==========
    // 단순 기록용 참고 데이터입니다. 실제 처방은 반드시 담당의 지시를 따라야 합니다.
    // - cycleDays: 한 사이클 길이(일)
    // - infusionDays: 사이클 내 주입/투여 일수 (0이면 경구 단독)
    // - type: 'infusion' | 'oral' | 'mixed' | 'custom'
    const REGIMEN_DISCLAIMER =
      '※ 본 레지멘 정보는 일반적인 참고 자료이며, 실제 처방·용량·일정은 담당 의료진의 지시를 따라야 합니다.';

    const REGIMEN_PRESETS = {
      // === 대장암 ===
      colorectal: {
        label: '대장암',
        regimens: [
          { name: 'FOLFOX', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '입원 또는 외래 후 46시간 지속주입 (보통 1박2일~2박3일)' },
          { name: 'FOLFIRI', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'FOLFOXIRI', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'XELOX (CAPOX)', cycleDays: 21, infusionDays: 1, type: 'mixed',
            desc: '옥살리플라틴 1일 + 카페시타빈 경구 14일' },
          { name: 'CAPIRI', cycleDays: 21, infusionDays: 1, type: 'mixed',
            desc: '이리노테칸 1일 + 카페시타빈 경구 14일' },
          { name: '카페시타빈 단독', cycleDays: 21, infusionDays: 0, type: 'oral',
            desc: '경구 14일 복용 후 7일 휴약' },
        ],
      },
      // === 유방암 ===
      breast: {
        label: '유방암',
        regimens: [
          { name: 'AC', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '아드리아마이신 + 사이클로포스파마이드' },
          { name: 'AC-T', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: 'AC 4회 후 탁솔/탁소텔' },
          { name: 'TC', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '도세탁셀 + 사이클로포스파마이드' },
          { name: 'TCH (TCHP)', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '도세탁셀 + 카보플라틴 + 허셉틴 (+퍼제타)' },
          { name: 'Paclitaxel weekly', cycleDays: 7, infusionDays: 1, type: 'infusion',
            desc: '주 1회 투여' },
          { name: 'Trastuzumab', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '허셉틴 단독 유지' },
        ],
      },
      // === 폐암 ===
      lung: {
        label: '폐암',
        regimens: [
          { name: 'Pemetrexed + Cisplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Pemetrexed + Carboplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Paclitaxel + Carboplatin', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Gemcitabine + Cisplatin', cycleDays: 21, infusionDays: 2, type: 'infusion',
            desc: '1일과 8일 투여' },
          { name: 'Etoposide + Cisplatin (EP)', cycleDays: 21, infusionDays: 3, type: 'infusion',
            desc: '소세포폐암, 1~3일 연속 투여 (보통 2박3일 입원)' },
          { name: 'Pembrolizumab', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '키트루다, 21일 또는 42일 주기' },
        ],
      },
      // === 위암 ===
      gastric: {
        label: '위암',
        regimens: [
          { name: 'XP (Capecitabine + Cisplatin)', cycleDays: 21, infusionDays: 1, type: 'mixed' },
          { name: 'FP (5-FU + Cisplatin)', cycleDays: 28, infusionDays: 5, type: 'infusion',
            desc: '5일 연속 입원 투여' },
          { name: 'DCF', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '도세탁셀+시스플라틴+5FU, 5일 입원' },
          { name: 'FOLFOX', cycleDays: 14, infusionDays: 2, type: 'infusion' },
          { name: 'Ramucirumab + Paclitaxel', cycleDays: 28, infusionDays: 1, type: 'infusion',
            desc: '1, 8, 15일 파클리탁셀 + 1, 15일 라무시루맙' },
        ],
      },
      // === 췌장암 / 담도암 ===
      pancreatic: {
        label: '췌장암/담도암',
        regimens: [
          { name: 'FOLFIRINOX', cycleDays: 14, infusionDays: 2, type: 'infusion',
            desc: '46시간 지속주입' },
          { name: 'Gemcitabine + Nab-paclitaxel', cycleDays: 28, infusionDays: 3, type: 'infusion',
            desc: '1, 8, 15일 투여 후 1주 휴약' },
          { name: 'Gemcitabine + Cisplatin', cycleDays: 21, infusionDays: 2, type: 'infusion',
            desc: '담도암 표준' },
          { name: 'Gemcitabine 단독', cycleDays: 28, infusionDays: 3, type: 'infusion',
            desc: '1, 8, 15일 투여' },
        ],
      },
      // === 혈액암 ===
      hematologic: {
        label: '혈액암 (림프종/백혈병)',
        regimens: [
          { name: 'R-CHOP', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: 'B세포 림프종 표준' },
          { name: 'R-CVP', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'ABVD', cycleDays: 28, infusionDays: 2, type: 'infusion',
            desc: '호지킨 림프종, 1일과 15일 투여' },
          { name: 'BEACOPP', cycleDays: 21, infusionDays: 7, type: 'infusion',
            desc: '입원 7일 강력 요법' },
          { name: 'DA-EPOCH-R', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '5일 지속주입 (보통 4박5일 입원)' },
          { name: 'Bendamustine + Rituximab', cycleDays: 28, infusionDays: 2, type: 'infusion' },
        ],
      },
      // === 부인암 ===
      gyne: {
        label: '난소암/자궁암',
        regimens: [
          { name: 'Paclitaxel + Carboplatin (TC)', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Carboplatin 단독', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Doxorubicin (PLD)', cycleDays: 28, infusionDays: 1, type: 'infusion' },
          { name: 'Topotecan', cycleDays: 21, infusionDays: 5, type: 'infusion',
            desc: '5일 연속 투여' },
          { name: 'Olaparib', cycleDays: 28, infusionDays: 0, type: 'oral',
            desc: '경구 매일 복용' },
        ],
      },
      // === 면역항암제 ===
      immune: {
        label: '면역항암제',
        regimens: [
          { name: 'Pembrolizumab (키트루다)', cycleDays: 21, infusionDays: 1, type: 'infusion',
            desc: '21일 또는 42일 주기' },
          { name: 'Nivolumab (옵디보)', cycleDays: 14, infusionDays: 1, type: 'infusion',
            desc: '14일 또는 28일 주기' },
          { name: 'Atezolizumab (티쎈트릭)', cycleDays: 21, infusionDays: 1, type: 'infusion' },
          { name: 'Durvalumab (임핀지)', cycleDays: 14, infusionDays: 1, type: 'infusion' },
          { name: 'Ipilimumab + Nivolumab', cycleDays: 21, infusionDays: 1, type: 'infusion' },
        ],
      },
      // === 직접 입력 ===
      custom: {
        label: '직접 입력',
        regimens: [
          { name: '직접 입력', cycleDays: 14, infusionDays: 1, type: 'custom',
            desc: '본인 처방전 기준으로 입력하세요' },
        ],
      },
    };

    // ========== 공통 UI ==========
    function Header({ title }) {
      const today = formatKoreanDate();
      return (
        <header className="safe-top sticky top-0 z-20 bg-softbg/95 backdrop-blur">
          <div className="px-5 pt-3 pb-3 flex items-end justify-between">
            <div>
              <div className="text-lg font-bold text-primary leading-tight">
                이겨내자 오늘도 🎗️
              </div>
              <div className="text-xs text-textsub mt-0.5">{today}</div>
            </div>
            <div className="text-sm font-semibold text-textmain">{title}</div>
          </div>
          <div className="h-px bg-primary/10" />
        </header>
      );
    }

    function TabBar({ current, onChange }) {
      return (
        <nav className="tab-bar fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px]
                        bg-white/95 backdrop-blur border-t border-primary/10 z-30 no-select">
          <ul className="flex">
            {TABS.map(t => {
              const active = current === t.key;
              return (
                <li key={t.key} className="flex-1">
                  <button
                    onClick={() => onChange(t.key)}
                    className={`w-full flex flex-col items-center justify-center py-2
                                ${active ? 'text-primary' : 'text-textsub'}`}
                    style={{ minHeight: '56px' }}
                    aria-label={t.label}
                  >
                    <span className="text-2xl leading-none">{t.icon}</span>
                    <span className={`text-[11px] mt-1 ${active ? 'font-bold' : ''}`}>
                      {t.label}
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
        </nav>
      );
    }

    function Card({ title, children, className = '' }) {
      return (
        <section className={`bg-white rounded-2xl shadow-card p-4 ${className}`}>
          {title && (
            <h2 className="text-base font-bold text-textmain mb-3">{title}</h2>
          )}
          {children}
        </section>
      );
    }

    function PrimaryButton({ children, onClick, disabled, type = 'button', className = '' }) {
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`rounded-full bg-primary text-white font-semibold px-5 py-3 no-select
                      active:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed
                      ${className}`}
          style={{ minHeight: '44px' }}
        >
          {children}
        </button>
      );
    }

    function GhostButton({ children, onClick, className = '' }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`rounded-full border border-primary/30 text-primary font-medium px-4 py-2
                      no-select active:bg-primary/5 ${className}`}
          style={{ minHeight: '40px' }}
        >
          {children}
        </button>
      );
    }

    function ConfirmDialog({ open, title, message, onConfirm, onCancel }) {
      if (!open) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-6"
          style={{ touchAction: 'none' }}
          onClick={onCancel}
        >
          <div
            className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-card"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="font-bold text-textmain text-base">{title}</div>
            <div className="text-sm text-textsub mt-2 leading-relaxed">{message}</div>
            <div className="flex gap-2 mt-5 justify-end">
              <GhostButton onClick={onCancel}>취소</GhostButton>
              <PrimaryButton onClick={onConfirm}>확인</PrimaryButton>
            </div>
          </div>
        </div>
      );
    }

    // ========== 탭 1: 홈 ==========
    function HomeTab({ onNavigate }) {
      const today = todayKey();

      // 화이팅 메시지
      const [cheeringList, setCheeringList] = useState(() =>
        loadData(STORAGE_KEYS.cheering, [])
      );
      const [cheeringDraft, setCheeringDraft] = useState('');
      const [overwriteOpen, setOverwriteOpen] = useState(false);

      useEffect(() => {
        saveData(STORAGE_KEYS.cheering, cheeringList);
      }, [cheeringList]);

      const todaysCheering = useMemo(
        () => cheeringList.find(c => c.date === today) || null,
        [cheeringList, today]
      );

      // 기분
      const [moodList, setMoodList] = useState(() =>
        loadData(STORAGE_KEYS.mood, [])
      );
      useEffect(() => {
        saveData(STORAGE_KEYS.mood, moodList);
      }, [moodList]);
      const todaysMood = useMemo(
        () => moodList.find(m => m.date === today) || null,
        [moodList, today]
      );

      // 요약용 데이터
      const vitals = loadData(STORAGE_KEYS.vitals, []);
      const meals = loadData(STORAGE_KEYS.meals, []);
      const sideEffects = loadData(STORAGE_KEYS.sideEffects, []);
      const medications = loadData(STORAGE_KEYS.medications, []);

      const todaysVital = vitals.find(v => v.date === today) || null;
      const todaysMeal  = meals.find(m => m.date === today) || null;
      const todaysSideEffect = sideEffects.find(s => s.date === today) || null;
      const todaysMedCount = medications.filter(m => m.date === today).length;

      const mealRatio = todaysMeal ? (() => {
        const parts = ['breakfast', 'lunch', 'snack', 'dinner']
          .map(k => (todaysMeal[k] ? Number(todaysMeal[k].ratio) || 0 : null))
          .filter(v => v !== null);
        if (parts.length === 0) return null;
        return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length);
      })() : null;

      const sideEffectCount = todaysSideEffect
        ? Object.values(todaysSideEffect.items || {}).filter(v => Number(v) > 0).length
        : null;

      // 저장 핸들러
      function handleSaveCheering() {
        const text = cheeringDraft.trim();
        if (!text) return;
        if (todaysCheering) {
          setOverwriteOpen(true);
          return;
        }
        commitCheering(text);
      }

      function commitCheering(text) {
        const mood = todaysMood ? todaysMood.emoji : null;
        const newItem = { id: generateId(), date: today, mood, text };
        setCheeringList(prev => {
          const without = prev.filter(c => c.date !== today);
          return [newItem, ...without];
        });
        setCheeringDraft('');
        setOverwriteOpen(false);
      }

      function handleOverwriteConfirm() {
        commitCheering(cheeringDraft.trim());
      }

      function handleSelectMood(m) {
        const emoji = m.emoji;
        setMoodList(prev => {
          const without = prev.filter(x => x.date !== today);
          return [{ date: today, emoji, value: m.value }, ...without];
        });
      }

      return (
        <div className="px-4 pb-6 space-y-4">

              <div className="space-y-3">
                <div className="rounded-xl border border-primary/30 bg-yellow-50 p-4">
                  <div className="text-xs text-textsub mb-1">
                    {formatKoreanDate(todaysCheering.date)}
                    {todaysCheering.mood ? ` · ${todaysCheering.mood}` : ''}

                    <span className="highlighter">{todaysCheering.text}</span>

                </div>
                <div className="flex gap-2">
                  <GhostButton
                    onClick={() => {
                      setCheeringDraft(todaysCheering.text);
                      setCheeringList(prev => prev.filter(c => c.date !== today));

                  >
                    수정하기
                  </GhostButton>

                    갤러리 보기
                  </GhostButton>
                </div>
              </div>

              <div className="space-y-3">
                <textarea
                  value={cheeringDraft}
                  onChange={(e) => setCheeringDraft(e.target.value)}
                  placeholder="오늘의 나에게 한마디를 남겨요 💪"
                  rows={3}
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3

                    onClick={handleSaveCheering}

          {/* 오늘의 기분 */}
          <Card title="💖 오늘의 기분">
            <div className="flex justify-between">
              {MOODS.map(m => {
                const active = todaysMood && todaysMood.value === m.value;
                return (
                  <button
                    key={m.value}
                    onClick={() => handleSelectMood(m)}
                    aria-label={m.label}
                    className={`mood-btn no-select flex flex-col items-center justify-center

                    style={{ width: 60, height: 60 }}

                    <span className="text-3xl leading-none">{m.emoji}</span>

            <div className="text-center text-xs text-textsub mt-3">
              {todaysMood

              <SummaryRow
                label="체중"
                value={todaysVital ? `${todaysVital.weight} kg${todaysVital.bsa ? ` · BSA ${todaysVital.bsa}` : ''}` : null}
                onGo={() => onNavigate('body')}
              />
              <SummaryRow
                label="식사량"
                value={mealRatio !== null ? `평균 ${mealRatio}%` : null}
                onGo={() => onNavigate('body')}
              />
              <SummaryRow
                label="부작용"

    function SummaryRow({ label, value, onGo }) {

          {empty && (
            <button

    // ========== 공통: 상세 보기 모달 ==========
    function DetailModal({ open, onClose, children }) {

    // ========== 탭 4: 마음 일기 ==========
    const GALLERY_GRADIENTS = [
      'from-pink-200 to-rose-100',
      'from-purple-200 to-indigo-100',
      'from-yellow-200 to-orange-100',
      'from-green-200 to-teal-100',
      'from-blue-200 to-cyan-100',
      'from-red-200 to-pink-100',

    function DiaryTab() {

      const [draftDate, setDraftDate] = useState(todayKey());
      const [draftMood, setDraftMood] = useState(null);
      const [draftBody, setDraftBody] = useState('');
      const [draftGrateful, setDraftGrateful] = useState(['', '', '']);

      // 일기 자동 저장
      useEffect(() => {

      // 선택 날짜의 기분을 igt_mood에서 pre-fill (홈 탭과 연동)
      useEffect(() => {
        const moods = loadData(STORAGE_KEYS.mood, []);
        const m = moods.find(x => x.date === draftDate);
        setDraftMood(m ? m.value : null);
      }, [draftDate]);

      function handleSelectMood(value) {
        setDraftMood(value);
        // 같은 날짜의 mood를 igt_mood에 write-back (홈과 연동)
        const mObj = MOODS.find(x => x.value === value);
        if (!mObj) return;
        const moods = loadData(STORAGE_KEYS.mood, []);
        const without = moods.filter(x => x.date !== draftDate);
        saveData(STORAGE_KEYS.mood, [
          { date: draftDate, emoji: mObj.emoji, value: mObj.value },
          ...without,
        ]);
      }

      function handleSave() {
        const body = draftBody.trim();
        if (!body) return;
        const moodObj = MOODS.find(m => m.value === draftMood);
        const entry = {
          id: generateId(),
          date: draftDate,
          mood: moodObj ? moodObj.emoji : null,
          body,
          grateful: draftGrateful.map(g => g.trim()).filter(Boolean),
          hard: draftHard.trim(),

        setDiaryList(prev => [entry, ...prev]);
        setDraftBody('');
        setDraftGrateful(['', '', '']);

      }

      const sortedDiaries = useMemo(

        [diaryList]
      );
      const sortedCheerings = useMemo(

      return (
        <div className="px-4 pb-6 space-y-4">
          {/* 4-1. 일기 작성 */}
          <Card title="📖 마음 일기 쓰기">
            <label className="block text-xs text-textsub mb-1">날짜</label>
            <input
              type="date"
              value={draftDate}
              onChange={(e) => setDraftDate(e.target.value)}
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 text-textmain"
            />

            <label className="block text-xs text-textsub mb-2">오늘의 기분</label>
            <div className="flex justify-between mb-4">
              {MOODS.map((m) => {
                const active = draftMood === m.value;
                return (
                  <button
                    key={m.value}
                    onClick={() => handleSelectMood(m.value)}
                    aria-label={m.label}
                    className={`mood-btn no-select flex items-center justify-center rounded-2xl
                                ${active ? 'selected bg-primary/10 ring-2 ring-primary' : 'bg-softbg'}`}
                    style={{ width: 54, height: 54 }}
                  >
                    <span className="text-2xl leading-none">{m.emoji}</span>
                  </button>
                );
              })}
            </div>

            <label className="block text-xs text-textsub mb-1">오늘의 이야기</label>
            <textarea
              value={draftBody}
              onChange={(e) => setDraftBody(e.target.value)}
              rows={8}
              placeholder="오늘 있었던 일, 느낀 점을 자유롭게 적어봐요."
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 resize-none text-textmain placeholder:text-textsub/70"
            />

            <label className="block text-xs text-textsub mb-1">감사한 일 3가지 (선택)</label>
            <div className="space-y-2 mb-4">
              {[0, 1, 2].map((i) => (
                <input
                  key={i}
                  type="text"
                  value={draftGrateful[i]}
                  onChange={(e) => {
                    const next = [...draftGrateful];
                    next[i] = e.target.value;
                    setDraftGrateful(next);
                  }}
                  placeholder={`감사 ${i + 1}`}
                  className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 text-textmain placeholder:text-textsub/70"
                />
              ))}
            </div>

            <label className="block text-xs text-textsub mb-1">힘들었던 점 (선택)</label>
            <textarea
              value={draftHard}
              onChange={(e) => setDraftHard(e.target.value)}
              rows={3}
              className="w-full rounded-xl border border-primary/20 bg-softbg px-3 py-3 mb-4 resize-none text-textmain"
            />

            <div className="flex justify-end">
              <PrimaryButton onClick={handleSave} disabled={!draftBody.trim()}>
                일기 저장
              </PrimaryButton>
            </div>
          </Card>

          {/* 4-2. 화이팅 갤러리 */}
          <Card title="💪 화이팅 갤러리">
            {sortedCheerings.length === 0 ? (
              <div className="py-6 text-center text-sm text-textsub">
                홈 탭에서 저장한 화이팅 메시지가 여기에 모여요.
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-3">
                {sortedCheerings.map((c, i) => (
                  <button
                    key={c.id || c.date}
                    onClick={() => setViewCheering(c)}
                    className={`no-select text-left p-3 rounded-2xl shadow-sm bg-gradient-to-br ${GALLERY_GRADIENTS[i % 10]} active:opacity-80`}
                    style={{ minHeight: 110 }}
                  >
                    <div className="text-[11px] text-textsub mb-1">
                      {c.date}{c.mood ? ` · ${c.mood}` : ''}
                    </div>
                    <div className="text-sm font-medium text-textmain leading-snug"
                         style={{
                           display: '-webkit-box',
                           WebkitLineClamp: 4,

                      onClick={() => setViewDiary(d)}
                      className="flex-1 text-left no-select py-1"
                    >
                      <div className="text-xs text-textsub mb-0.5">
                        {d.date}{d.mood ? ` · ${d.mood}` : ''}
                      </div>
                      <div className="text-sm text-textmain leading-snug"
                           style={{
                             display: '-webkit-box',
                             WebkitLineClamp: 2,
                             WebkitBoxOrient: 'vertical',
                             overflow: 'hidden',
                           }}>
                        {d.body}
                      </div>
                    </button>
                    <button
                      onClick={() => setDeleteId(d.id)}
                      aria-label="삭제"
                      className="text-lg no-select active:opacity-70 flex items-center justify-center rounded-full"
                      style={{ minHeight: 40, minWidth: 40 }}

          </Card>

          {/* 화이팅 상세 모달 */}

          <ConfirmDialog

            onCancel={() => setDeleteId(null)}

    }

    // ========== 탭 5: 병원비 관리 ==========
    const EXPENSE_CATEGORIES = ['진료비', '약제비', '검사비', '입원비', '기타'];
    const PAYMENT_METHODS = ['현금', '카드', '실비청구'];
    const CATEGORY_COLORS = ['#E91E8C', '#6C63FF', '#10B981', '#F59E0B', '#EF4444'];

    // ========== 5-3 대시보드 차트 ==========
    function ExpenseDashboard({ expenses }) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = now.getMonth();
      const thisMonthKey = `${yyyy}-${String(mm + 1).padStart(2, '0')}`;

      // 이번 달 지출만 필터
      const thisMonthExpenses = useMemo(
        () => expenses.filter((e) => (e.date || '').startsWith(thisMonthKey)),
        [expenses, thisMonthKey]
      );

      // PieChart 데이터: 이번 달 카테고리별 합계
      const pieData = useMemo(() => {
        const map = Object.fromEntries(EXPENSE_CATEGORIES.map((c) => [c, 0]));
        thisMonthExpenses.forEach((e) => {
          if (map[e.category] !== undefined) {
            map[e.category] += Number(e.amount) || 0;
          }
        });
        return EXPENSE_CATEGORIES
          .map((c) => ({ name: c, value: map[c] }))
          .filter((d) => d.value > 0);
      }, [thisMonthExpenses]);

      const monthTotal = useMemo(
        () => thisMonthExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0),
        [thisMonthExpenses]
      );

      // BarChart 데이터: 전체 기간 청구 vs 본인부담
      const barData = useMemo(() => {
        let claim = 0;
        let self = 0;
        expenses.forEach((e) => {
          const amt = Number(e.amount) || 0;
          if (e.payment === '실비청구') claim += amt;
          else self += amt;
        });
        return [
          { name: '실비청구', amount: claim, fill: '#6C63FF' },
          { name: '본인부담', amount: self, fill: '#E91E8C' },
        ];
      }, [expenses]);

      // LineChart 데이터: 최근 6개월 월별 합계
      const lineData = useMemo(() => {
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(yyyy, mm - i, 1);
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          months.push({ key, month: key, total: 0 });
        }
        const idx = Object.fromEntries(months.map((m, i) => [m.key, i]));
        expenses.forEach((e) => {
          const k = (e.date || '').slice(0, 7);
          if (idx[k] !== undefined) {
            months[idx[k]].total += Number(e.amount) || 0;
          }
        });
        return months;
      }, [expenses, yyyy, mm]);

      // 금액 축 포맷 (만 단위 축약)
      const tickFormatMoney = (v) => {
        if (v >= 10000) return `${Math.round(v / 10000)}만`;
        return v;
      };

      return (
        <Card title="📈 요약 대시보드">
          {/* 차트 1: 이번 달 카테고리별 도넛 */}
          <div className="mb-6">
            <div className="text-xs text-textsub mb-2">이번 달 카테고리별 지출</div>
            <div className="relative">
              <ResponsiveContainer width="100%" height={200}>
                <PieChart>
                  <Pie
                    data={pieData.length > 0 ? pieData : [{ name: '데이터 없음', value: 1 }]}
                    dataKey="value"
                    nameKey="name"
                    cx="50%"
                    cy="50%"
                    innerRadius={55}
                    outerRadius={85}
                    paddingAngle={pieData.length > 1 ? 2 : 0}
                    isAnimationActive={false}
                  >
                    {(pieData.length > 0 ? pieData : [{ name: '데이터 없음' }]).map((entry, i) => (
                      <Cell
                        key={i}
                        fill={pieData.length > 0 ? CATEGORY_COLORS[i % CATEGORY_COLORS.length] : '#E5E7EB'}
                      />
                    ))}
                  </Pie>
                  {pieData.length > 0 && (
                    <Tooltip formatter={(v) => `${formatWithComma(v)}원`} />
                  )}
                </PieChart>
              </ResponsiveContainer>
              <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
                <div className="text-[11px] text-textsub">이번 달 총액</div>
                <div className="text-base font-bold text-primary">
                  {formatWithComma(monthTotal)}원
                </div>
              </div>
            </div>
            {pieData.length > 0 ? (
              <div className="flex flex-wrap gap-x-3 gap-y-1 justify-center mt-2">
                {pieData.map((d, i) => (
                  <div key={d.name} className="flex items-center gap-1 text-xs">
                    <span
                      className="inline-block w-2.5 h-2.5 rounded-full"
                      style={{ backgroundColor: CATEGORY_COLORS[i % CATEGORY_COLORS.length] }}
                    />
                    <span className="text-textsub">
                      {d.name} {formatWithComma(d.value)}원
                    </span>

          <div className="mb-6">

    function formatWithComma(digitsOnly) {
      if (!digitsOnly) return '';
      return Number(digitsOnly).toLocaleString('ko-KR');
    }
    function parseMoney(str) {
      const digits = String(str || '').replace(/[^\d]/g, '');
      return digits ? Number(digits) : 0;
    }
    function handleCommaInput(value, setter) {
      const digits = String(value).replace(/[^\d]/g, '');
      setter(formatWithComma(digits));
    }
